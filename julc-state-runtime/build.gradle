description = 'JOUST off-chain runtime: locate, run, build, evaluate, submit for generated clients'

dependencies {
    api project(':julc-state-api')
    api libs.julc.cardano.client.lib
    api libs.cardano.client.lib
    api libs.cardano.client.backend
    api libs.cardano.client.mpf          // MerkleMap mirrors (ADR-0002)
    runtimeOnly libs.cardano.client.mpf.rocksdb   // their default store, loaded by name (ADR-0015 §13.12 M3)
    api project(':julc-state-verifier')  // the map verifier script (ADR-0002 D9)
    // JulcScriptLoader (loads the compiled validator from META-INF/plutus) lives in the annotation processor artifact
    implementation libs.julc.annotation.processor
    implementation libs.julc.vm.java       // transition programs (ADR-0015 D3) and the evaluator
}

// ADR-0020 D8: the JuLC version of this build (gradle/libs.versions.toml), recorded in and checked against the
// program manifests. A generated constant: the Wasm images read no resources for it.
def julcVersionDir = layout.buildDirectory.dir('generated/sources/julc-version/java')
def generateJulcVersion = tasks.register('generateJulcVersion') {
    def version = libs.versions.julc.get()
    inputs.property('julc', version)
    outputs.dir(julcVersionDir)
    doLast {
        def f = new File(julcVersionDir.get().asFile, 'org/julclang/state/runtime/described/JulcVersion.java')
        f.parentFile.mkdirs()
        f.text = """package org.julclang.state.runtime.described;

/** GENERATED by the build: the JuLC version this module was built with (ADR-0020 D8). */
public final class JulcVersion {
    public static final String VERSION = "${version}";

    private JulcVersion() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(generateJulcVersion)
