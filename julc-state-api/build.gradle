description = 'JOUST public API: @StateContract, Ctx, Payout, Require (on-chain compilable + JVM runnable)'

dependencies {
    api libs.julc.stdlib

    // MPF differential tests: the JuLC-subset Mpf library against cardano-client-lib's MpfTrie.
    testImplementation libs.cardano.client.mpf
    testImplementation libs.cardano.client.lib
    testImplementation libs.julc.testkit
    testRuntimeOnly libs.bouncycastle.bcprov
}

// JuLC compiles validators against a fixed class path (its own on-chain API) plus *library sources*:
// .java files shipped under META-INF/plutus-sources/ (listed in index.txt) by entries of the annotation
// processor path. Every source of this module is shipped that way, so a @StateContract class and the
// validator generated from it can use JOUST's annotations and helpers on-chain.
//
// src/onchain/java holds on-chain variants of a few classes whose JVM body must differ (Require: the JVM
// throws with the message, on-chain traces and errors). A file there replaces the src/main/java file of the
// same path in the bundle. Keep that set tiny; ADR-0001 D7.
def onchainOverrides = file('src/onchain/java')
def discoveryOverrides = file('src/discovery/java')
def bundleDir = layout.buildDirectory.dir('generated/julc-state/onchain-sources')
def bundleOnchainSources = tasks.register('bundleOnchainSources') {
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    if (onchainOverrides.exists()) inputs.dir(onchainOverrides)
    if (discoveryOverrides.exists()) inputs.dir(discoveryOverrides)
    outputs.dir(bundleDir)
    doLast {
        def root = bundleDir.get().asFile
        project.delete(root)
        def target = new File(root, 'META-INF/plutus-sources')
        def sources = new TreeMap<String, File>()
        fileTree(srcDir).matching { include '**/*.java'; exclude '**/package-info.java', '**/RequireException.java' }.visit { d ->   // RequireException: JVM-only
            if (!d.directory) sources[d.relativePath.pathString] = d.file
        }
        if (onchainOverrides.exists()) {
            fileTree(onchainOverrides).matching { include '**/*.java' }.visit { d ->
                if (!d.directory) {
                    if (!sources.containsKey(d.relativePath.pathString))
                        throw new GradleException("on-chain override without a JVM counterpart: ${d.relativePath}")
                    sources[d.relativePath.pathString] = d.file
                }
            }
        }
        sources.each { path, file ->
            def out = new File(target, path)
            out.parentFile.mkdirs()
            out.text = file.getText('UTF-8')
        }
        new File(target, 'index.txt').text = sources.keySet().join('\n') + '\n'
        // ADR-0015 D3, ADR-0020 §11.4: variants compiled only into transition programs (MerkleMaps' read discovery,
        // Require's joust:require tag), never into validators; the toolchain swaps them in and records each in the
        // program manifest. Not under plutus-sources, so JuLC's source scan never sees them.
        if (discoveryOverrides.exists()) {
            fileTree(discoveryOverrides).matching { include '**/*.java' }.visit { d ->
                if (!d.directory) {
                    def out = new File(root, 'META-INF/joust/discovery/' + d.relativePath.pathString)
                    out.parentFile.mkdirs()
                    out.text = d.file.getText('UTF-8')
                }
            }
        }
    }
}
// Not added to the main jar on purpose: julc-state-processor depends on this module, so the jar also lands on the
// processor path, and a rebuilt jar there makes JuLC's source scan abort (it stops at the first unreadable index,
// skipping julc-stdlib's sources too; ADR-0001 F8). The bundle ships only through `onchainSources` below.
// Publishing will add it as a separate `onchain` classifier jar.

// Consumers in this build put the bundle on their annotation processor path as a *directory*:
//   annotationProcessor project(path: ':julc-state-api', configuration: 'onchainSources')
// A jar would work too, but a rebuilt jar on the processor path of a long-lived Gradle daemon can make
// JuLC's source scan silently find nothing (ADR-0001 F8).
configurations {
    onchainSources {
        canBeConsumed = true
        canBeResolved = false
    }
}
artifacts {
    onchainSources(bundleDir) { builtBy bundleOnchainSources }
}

// External consumers put this jar on their annotation processor path:
//   annotationProcessor "org.julclang:julc-state-api:<version>:onchain"
def onchainJar = tasks.register('onchainJar', Jar) {
    archiveClassifier = 'onchain'
    from(bundleDir)
    dependsOn bundleOnchainSources
}
pluginManager.withPlugin('maven-publish') {
    afterEvaluate {
        publishing.publications.withType(MavenPublication).configureEach { artifact onchainJar }
    }
}

