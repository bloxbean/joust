name: Docs site

# The documentation site (www/: Astro Starlight), served at https://joust.julc.dev from GitHub Pages. From the
# release-ops standard (templates/workflows/docs-deploy.yml), as JuLC's docs-deploy.yml and yano's:
#   build    every trigger. `npm run build` checks that no page hard-codes a release version, builds the site and the AI
#            artifacts, and checks every internal link; then this job checks the custom domain and the canonical links,
#            and uploads www/dist as the artifact docs-site. Read-only token.
#   publish  pushes to main and manual runs on main only: pushes that artifact to the gh-pages branch (contents: write,
#            this run's GITHUB_TOKEN). Pages serves gh-pages ("Deploy from a branch"), so the live site does not change
#            until GitHub's own pages-build-deployment run for that push is approved in the `github-pages` environment
#            (which deploys from gh-pages only): every publish goes through that approval. A pull request only builds.
# Not triggered by tags: anyone with write access can create a non-v* tag. The site also reads files outside www/ at
# build time (the .jsc grammar, julc-state-api's annotations for ai/catalog.json, examples/README.md), so changes to
# those rebuild it too. docs/release-ops.md, "Docs site", has the one-time setup.
#
# Every action is pinned by its commit SHA. npm installs run with --ignore-scripts, from www/package-lock.json.

on:
  pull_request:
    paths:
      - 'www/**'
      - '.github/workflows/docs.yml'
      - 'js/vscode-joust/syntaxes/jsc.tmLanguage.json'
      - 'julc-state-api/src/main/java/**'
      - 'examples/README.md'
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - '.github/workflows/docs.yml'
      - 'js/vscode-joust/syntaxes/jsc.tmLanguage.json'
      - 'julc-state-api/src/main/java/**'
      - 'examples/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The site's identity (www/site.config.mjs; JOUST_SITE_URL is not set, so the default applies).
      SITE_HOST: joust.julc.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'   # exact, as publish-vscode.yml

      - name: Install the site's dependencies
        working-directory: www
        run: npm ci --ignore-scripts

      # check-versions.mjs, astro build (with the AI artifacts), check-links.mjs.
      - name: Build the site and check it
        working-directory: www
        run: npm run build

      # GitHub Pages serves the custom domain from dist/CNAME (public/CNAME); the canonical links and the sitemap must
      # name the same host.
      - name: Check the custom domain and canonical links
        working-directory: www/dist
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < CNAME)" = "$SITE_HOST" || { echo "::error::dist/CNAME is not $SITE_HOST"; exit 1; }
          grep -q "<link rel=\"canonical\" href=\"https://$SITE_HOST/\"" index.html \
            || { echo "::error::index.html's canonical link is not https://$SITE_HOST/"; exit 1; }
          grep -q "<link rel=\"canonical\" href=\"https://$SITE_HOST/start/quick-start-java/\"" start/quick-start-java/index.html \
            || { echo "::error::a page's canonical link is not on https://$SITE_HOST/"; exit 1; }
          grep -q "<loc>https://$SITE_HOST/</loc>" sitemap-0.xml || { echo "::error::the sitemap is not on https://$SITE_HOST/"; exit 1; }
          echo "CNAME, canonical links and sitemap name https://$SITE_HOST/"

      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: www/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Only main publishes, only in this repository; a pull request, or a manual run on another branch, only builds.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && github.repository == 'bloxbean/joust'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: site

      # Replaces the whole gh-pages tree with the built site, with a CNAME for the custom domain and a .nojekyll (the
      # action's default), so Pages serves _astro/ as is. The commit is github-actions[bot]'s (the action would
      # otherwise use the triggering actor) and names main's commit and this run: what the approver checks before
      # approving its pages-build-deployment (docs/release-ops.md, "Docs site").
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: joust.julc.dev
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          full_commit_message: 'deploy: ${{ github.sha }} (Docs site run ${{ github.run_id }})'

      - name: Record the pending Pages deployment
        shell: bash
        run: |
          {
            echo "## Pushed to gh-pages - waiting for approval"
            echo
            echo "The site updates after the \`pages-build-deployment\` run for this push is approved in the"
            echo "\`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
