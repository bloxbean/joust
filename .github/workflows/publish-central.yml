# From the release-ops standard (templates/workflows/release.yml and publish-central.yml), adapted for JOUST while the
# repository is private: a v* tag, created by hand for now, runs the release.
name: Publish to Maven Central and npm

# A v* tag builds and signs every Maven module once, and uploads a USER_MANAGED Central Portal deployment. It stops
# there: nothing is on Maven Central until a human publishes the deployment in the Central Portal (publishing cannot
# be undone: a released version can never be replaced). Then the npm job publishes JOUST's four npm packages through
# npm trusted publishing (GitHub OIDC, no npm token; as cardano-client-bindings, mesmo, yaci-devkit and yano), or only
# checks them (`npm publish --dry-run`) while npm_publish is false in gradle.properties.
#
# To release: set `version` in gradle.properties to the release (no -SNAPSHOT) and pin released dependencies, merge,
# then push the tag v<version> from that commit.

on:
  push:
    tags:
      - 'v*'

permissions: {}

# Never cancel a run that may already have uploaded a deployment or published a package.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The signing subkey and the Central Portal token are secrets of this environment, which accepts v* tags.
    environment: release-staging
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_final: ${{ steps.version.outputs.is_final }}
      npm_publish: ${{ steps.version.outputs.npm_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and read release flags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PROPS=$(./gradlew -q properties)
          VERSION=$(awk '/^version:/ { print $2; exit }' <<< "$PROPS")
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match Gradle version ${VERSION}" >&2
            exit 1
          fi
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi
          IS_FINAL=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then IS_FINAL=true; fi
          # Where the artifacts go must be stated, not defaulted: a missing line is an error.
          MAVEN_CENTRAL_PUBLISH=$(awk '/^maven_central_publish:/ { print $2; exit }' <<< "$PROPS")
          NPM_PUBLISH=$(awk '/^npm_publish:/ { print $2; exit }' <<< "$PROPS")
          for flag in "maven_central_publish=$MAVEN_CENTRAL_PUBLISH" "npm_publish=$NPM_PUBLISH"; do
            if [[ "${flag#*=}" != true && "${flag#*=}" != false ]]; then
              echo "::error::gradle.properties must set ${flag%%=*} to true or false." >&2
              exit 1
            fi
          done
          {
            echo "version=$VERSION"
            echo "is_final=$IS_FINAL"
            echo "maven_central_publish=$MAVEN_CENTRAL_PUBLISH"
            echo "npm_publish=$NPM_PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (final: $IS_FINAL), Maven Central: $MAVEN_CENTRAL_PUBLISH, npm: $NPM_PUBLISH"

      # Central hosts no snapshots: a release that names one could never be resolved by its users.
      - name: Refuse snapshot dependencies
        if: steps.version.outputs.maven_central_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[a-zA-Z0-9-]+ *= *"[^"]*SNAPSHOT"' gradle/libs.versions.toml; then
            echo "::error::gradle/libs.versions.toml pins a SNAPSHOT (above). Release it first, then pin the release." >&2
            exit 1
          fi

      # Tests tagged devnet skip themselves: no Yaci DevKit runs here (build.yml runs them on every PR).
      - name: Build with Gradle
        run: ./gradlew build verifyMavenReleasePublicationScope --stacktrace

      # The one step that signs, with the subkey passed to Gradle in memory (configureReleaseSigning in build.gradle):
      # nothing is written to disk and nothing appears on the command line.
      - name: Build and sign the Central bundle
        if: steps.version.outputs.maven_central_publish == 'true'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY_ASC }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew nmcpZipAggregation --stacktrace

      # Only the files Central requires, which also counts against the namespace's file limit (shared with JuLC):
      # each jar and POM with its .asc signature and its MD5 and SHA-1. No maven-metadata.xml (Central writes its own),
      # no checksums of signatures, no SHA-256/512 (gradle.properties), no Gradle module metadata (build.gradle).
      - name: Check the Central bundle holds only what Central requires
        if: steps.version.outputs.maven_central_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=build/nmcp/zip/aggregation.zip
          python3 - "$BUNDLE" <<'EOF'
          import sys, zipfile
          names = [n for n in zipfile.ZipFile(sys.argv[1]).namelist() if not n.endswith('/')]
          artifacts = [n for n in names if n.endswith(('.jar', '.pom'))]
          wanted = set(artifacts) | {a + s for a in artifacts for s in ('.asc', '.md5', '.sha1')}
          extra, missing = sorted(set(names) - wanted), sorted(wanted - set(names))
          if extra or missing:
              print(f"::error::bundle mismatch: unexpected {extra[:10]} ... missing {missing[:10]}")
              sys.exit(1)
          print(f"{len(names)} files: {len(artifacts)} artifacts, each with .asc, .md5 and .sha1")
          EOF

      # If the Central upload fails, this exact bundle is how Central still gets the same bytes: upload it in the
      # Central Portal.
      - name: Keep the Central bundle
        if: steps.version.outputs.maven_central_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ steps.version.outputs.version }}
          path: build/nmcp/zip/aggregation.zip
          retention-days: 90
          if-no-files-found: error

      # Uploads a USER_MANAGED deployment and waits for Sonatype validation. It stops there: nothing is on Maven Central
      # until a human publishes it in the Central Portal. `-x nmcpZipAggregation` uploads the bundle checked above.
      - name: Upload deployment to Maven Central staging
        id: upload
        if: steps.version.outputs.maven_central_publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # No --warn: it lowers Gradle below LIFECYCLE, where nmcp reports the deployment id.
          ./gradlew publishAggregationToCentralPortal -x nmcpZipAggregation --stacktrace 2>&1 | tee upload.log
          id=$(grep -oE "deployment bundle '[0-9a-f-]{36}'" upload.log | head -1 | grep -oE '[0-9a-f-]{36}' || true)
          if [[ -z "$id" ]]; then
            echo "::error::Upload succeeded but no deployment id was found in the log." >&2
            exit 1
          fi
          echo "deployment-id=$id" >> "$GITHUB_OUTPUT"

      - name: Record the Maven release
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
          VERSION: ${{ steps.version.outputs.version }}
          MAVEN_CENTRAL_PUBLISH: ${{ steps.version.outputs.maven_central_publish }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## JOUST \`$VERSION\`: Maven artifacts"
            echo
            if [[ "$MAVEN_CENTRAL_PUBLISH" != true ]]; then
              echo "Maven Central: not staged (maven_central_publish=false)."
            elif [[ -n "$DEPLOYMENT_ID" ]]; then
              echo "**Maven Central: staged, not yet published.** Deployment \`$DEPLOYMENT_ID\` is validated."
              echo "Publish it in the Central Portal (https://central.sonatype.com/publishing/deployments)."
            else
              echo "**Maven Central: NOT staged** - the upload failed or did not run. The bundle is kept as an artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  npm:
    needs: maven
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Trusted publishing: npm exchanges the GitHub OIDC token for publish credentials, so there is no npm token secret.
    # Each package's trusted publisher on npmjs.com names this repository, this workflow file (publish-central.yml:
    # the publish commands must stay in THIS file, which npm validates) and this environment. Requires npm >= 11.5.1
    # and Node >= 22.14.
    environment: release-staging
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.maven.outputs.version }}
      IS_FINAL: ${{ needs.maven.outputs.is_final }}
      NPM_PUBLISH: ${{ needs.maven.outputs.npm_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The engines are GraalVM Web Images (ADR-0015): Oracle GraalVM 25 with Web Image (--tool:svm-wasm), and Binaryen.
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Web Image and install Binaryen
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GRAALVM_HOME/lib/svm/tools/svm-wasm" ]]; then
            echo "::error::This GraalVM has no Web Image (lib/svm/tools/svm-wasm); the engines cannot be built." >&2
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q binaryen
          wasm-opt --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Build the engines
        run: >-
          ./gradlew :julc-state-runtime-wasm:runtimeWasm :julc-state-toolchain:toolchainWasm
          -PgraalvmHome="$GRAALVM_HOME" --stacktrace

      # The four packages at the release version, depending on each other at that version; the template too. The
      # local-registry publishConfig (development, js/publish-local.sh) is dropped.
      - name: Prepare the packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js/joust-runtime/engine js/joust/engine
          cp julc-state-runtime-wasm/build/wasm/{joust-runtime.js,joust-runtime.js.wasm,package.json} js/joust-runtime/engine/
          cp julc-state-toolchain/build/wasm/{joust-toolchain.js,joust-toolchain.js.wasm,package.json} js/joust/engine/
          node - <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const files = ['state-client', 'joust-runtime', 'joust', 'create-joust'].map((p) => `js/${p}/package.json`);
          files.push('js/create-joust/template/package.json');
          for (const f of files) {
            const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
            if (!f.includes('/template/')) { pkg.version = version; delete pkg.publishConfig; }
            for (const deps of [pkg.dependencies, pkg.devDependencies, pkg.peerDependencies]) {
              for (const name of Object.keys(deps ?? {})) if (name.startsWith('@julclang/')) deps[name] = version;
            }
            fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            console.log(`${f}: ${pkg.name}@${pkg.version ?? '(template)'}`);
          }
          EOF

      # In dependency order. Prereleases get a matching dist-tag (as cardano-client-bindings), so they never become
      # `latest`. Provenance attestations need a public repository: added once JOUST's repository is public.
      - name: Publish the packages
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=latest
          case "$VERSION" in
            *-preview*|*-pre*|*-alpha*) TAG=preview ;;
            *-beta*)                    TAG=beta ;;
            *-rc*)                      TAG=next ;;
          esac
          ARGS=(--access public --tag "$TAG" --ignore-scripts)
          if [[ "$REPO_PRIVATE" != true ]]; then ARGS+=(--provenance); fi
          if [[ "$NPM_PUBLISH" != true ]]; then ARGS+=(--dry-run); fi
          for p in state-client joust-runtime joust create-joust; do
            # Leading ./ : npm would read a bare path as a github:owner/repo shorthand.
            npm publish "./js/$p" "${ARGS[@]}"
          done

      - name: Record the npm release
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## JOUST \`$VERSION\`: npm packages"
            echo
            if [[ "$NPM_PUBLISH" == true ]]; then
              echo "Published @julclang/state-client, @julclang/joust-runtime, @julclang/joust and create-joust" \
                "\`$VERSION\` through npm trusted publishing, if the step above succeeded."
            else
              echo "Checked only (npm_publish=false in gradle.properties): \`npm publish --dry-run\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
