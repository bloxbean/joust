name: Fuzz (nightly)

# The long fuzz campaigns (review r1, design F3; JuLC's difftest-nightly.yml and ADR-063 D13): pull requests only replay
# the saved inputs (`test`) and fuzz the public targets for 30 s (build.yml); here each public target runs for its
# duration every night, on main, from the corpus the last night left (actions/cache), and a failure uploads its input and
# its record. The decoders of on-chain data (ValueAdapterFuzzTest, AddressAdapterFuzzTest, MemoFuzzTest) are not fuzzed
# here: a finding can be a vulnerability and this repository's logs and artifacts are public, so they are fuzzed locally
# and reported privately (SECURITY.md, docs/contributing/reviewing.md §3). No secret is used.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      five_way_minutes:
        description: 'Minutes for the five-way target'
        type: string
        default: '60'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: julc-state-toolchain
            target: FiveWayFuzzTest
            duration: five-way
          - module: julc-state-dsl
            target: IrReaderFuzzTest
            duration: 20m
          - module: julc-state-toolchain
            target: NodeOptionsFuzzTest
            duration: 10m
    name: fuzz (${{ matrix.target }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-home-cache-strict-match: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The corpus Jazzer grew last night (.cifuzz-corpus, git-ignored), so each night continues rather than starts cold.
      - name: Restore the corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.module }}/.cifuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          MODULE: ${{ matrix.module }}
          TARGET: ${{ matrix.target }}
          DURATION: ${{ matrix.duration }}
          FIVE_WAY: ${{ inputs.five_way_minutes || '60' }}
        run: |
          set -o pipefail
          if [[ "$DURATION" == five-way ]]; then DURATION="${FIVE_WAY}m"; fi
          mkdir -p build
          ./gradlew ":${MODULE}:fuzz" --tests "*${TARGET}" -Pfuzz.duration="$DURATION" --info --stacktrace 2>&1 | tee build/fuzz-gradle.log \
            | grep -E --line-buffered 'DONE|\[fuzz\]|FAILED|pulse'

      - name: Report
        if: always()
        run: |
          python3 scripts/verification-report.py build/verification --fuzz-log build/fuzz-gradle.log | tee -a "$GITHUB_STEP_SUMMARY"

      # The failing input is saved as crash-* beside the target's seeds; its record (the program and calls, or the data,
      # and every leg's answer) is in build/fuzz/. For the five-way target, the record's .plan file replays it as a
      # source-level case (FiveWayRegressionTest) whatever the generator's version.
      - name: Upload the failing input and its record
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            ${{ matrix.module }}/src/test/resources/**/crash-*
            ${{ matrix.module }}/build/fuzz/
            build/fuzz-gradle.log
          retention-days: 30

      - name: Upload the summary
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-summary-${{ matrix.target }}
          path: |
            ${{ matrix.module }}/build/fuzz/*.summary.txt
            build/verification/fuzz.txt
          retention-days: 30
