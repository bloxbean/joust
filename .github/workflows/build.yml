name: Build

# Builds and tests every module and example, in parallel jobs, once per pushed head; the head's results are published as
# artifacts, so a reviewer fetches them (scripts/fetch-ci-build.sh <sha>; docs/contributing/reviewing.md) instead of
# building again:
#   build     compile, unit, harness, attack-suite, five-way and fuzz-replay tests, the short fuzz runs, the JavaScript
#             packages' tests and the dApp page; no DevKit (-PnoDevnet excludes the tests tagged devnet). Publishes
#             `verification` (JUnit XML of the JVM and npm tests, the five-way counts, the fuzz summary and any fuzz
#             findings).
#   devnet    the DevKit tests (@Tag("devnet")), sharded by .github/ci/devnet-shards.txt: each shard runs on its own runner
#             against its own Yaci DevKit, so shards share neither a devnet nor its faucet.
#   plan      checks that every module with DevKit tests is in exactly one shard, and hands the shards to devnet.
#   engines   the npm packages' Wasm engines, and the create-joust templates built with them. Publishes `engines` (both
#             engines and their SHA-256 digests, engines.sha256).
#   cli       the native joust (ADR-0017 D8), end to end with this commit's modules, plugin and engines.
#   vscode    the VS Code extension (ADR-0021), packaged with this commit's engine and tested in VS Code. Publishes
#             `vscode-joust-vsix` (the .vsix and its digest).
#   mutation  PIT on the changed security-relevant Java and Stryker on the changed security-relevant JavaScript (the
#             classes and files gradle/pitest.gradle's modules and js/mutation/stryker.config.mjs name), with a reported
#             score and a threshold. Publishes `mutation`.
# bloxbean-snapshot.yml publishes only commits whose push run of this workflow passed: every job must pass.
#
# Every action is pinned by its commit SHA. No job reads a repository secret; the engine and CLI jobs pass the run's
# read-only GITHUB_TOKEN (permissions: contents: read) to setup-graalvm, which only raises its API rate limit. npm
# installs run with --ignore-scripts; the one package whose binary its install script fetches (tree-sitter-cli, pinned
# in tree-sitter-jsc's lock file) is rebuilt by name.

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Where scripts/node-test.sh writes the npm tests' JUnit XML (the verification artifact).
  NODE_TEST_RESULTS: ${{ github.workspace }}/build/npm-test-results
  # The head every job but devnet builds: a pull request's own head commit, not the merge with its base that
  # pull_request checks out by default, so the artifacts are the head's, the commit a reviewer has checked out
  # (scripts/fetch-ci-build.sh checks it). A push builds its commit.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      # A module whose DevKit tests are in no shard would silently stop running them in CI.
      - name: Read the shards and check they cover every DevKit test module
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, re, subprocess
          lines = [l.split() for l in open('.github/ci/devnet-shards.txt') if l.strip() and not l.startswith('#')]
          tasks = [t for line in lines for t in line]
          dupes = sorted({t for t in tasks if tasks.count(t) > 1})
          files = subprocess.run(['git', 'grep', '-l', '@Tag("devnet")', '--', '*.java'],
                                 capture_output=True, text=True, check=True).stdout.split()
          modules = sorted({':' + re.sub(r'/src/.*', '', f).replace('/', ':') + ':test' for f in files})
          missing = sorted(set(modules) - set(tasks))
          extra = sorted(set(tasks) - set(modules))
          if dupes or missing or extra:
              print(f"::error::devnet-shards.txt: in several shards {dupes}; in no shard {missing}; no DevKit tests {extra}")
              raise SystemExit(1)
          shards = [{'index': i + 1, 'tasks': ' '.join(line)} for i, line in enumerate(lines)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('shards=' + json.dumps(shards) + '\n')
          print(f"{len(modules)} DevKit test modules in {len(shards)} shards")
          EOF

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The wallet example's page proof of concept (examples/wallet/js) needs its Node dependencies.
      - name: Install the wallet page's Node dependencies
        working-directory: examples/wallet/js
        run: npm ci --ignore-scripts

      # The JavaScript client (ADR-0013 D3): its unit tests, then the dApp page that uses it.
      - name: Test the JavaScript client
        working-directory: js/state-client
        run: |
          npm ci --ignore-scripts
          ../../scripts/node-test.sh state-client test/*.test.js

      # npm create joust: what each template and contract language writes, and the command line.
      - name: Test create-joust
        working-directory: js/create-joust
        run: ../../scripts/node-test.sh create-joust test/*.test.js

      # ADR-0018 D13: the tree-sitter grammar (its own tests, then the shared parse corpus against the hand-written
      # parsers' verdicts and declarations, which JscCorpusTest checks on the Java side), and the TextMate grammar.
      # tree-sitter-cli's install script fetches its binary: it alone is rebuilt (the version is the lock file's).
      - name: Test the tree-sitter grammar and the shared parse corpus
        working-directory: tree-sitter-jsc
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npm test

      # The VS Code extension's Node-only tests (ADR-0021 D12): the TextMate grammar, the verified applyEdit handler, the
      # build task, the manifest. The packaged extension is tested in the vscode job.
      - name: Test the VS Code extension's grammar and client
        working-directory: js/vscode-joust
        run: |
          npm ci --ignore-scripts
          ../../scripts/node-test.sh vscode-joust test/*.test.mjs

      # The npm joust's command line (ADR-0017 D5, D9), and joust deploy's write of deployments.<network>.json with the
      # runtime and wallet stubbed (issue #75). Two cases run the command from this copy, whose build.js imports the
      # client: this repository's packages are linked beside js/joust, as in the engines job (no registry).
      - name: Test the npm joust command line
        run: |
          mkdir -p js/node_modules/@julclang
          ln -sfn ../../state-client js/node_modules/@julclang/state-client
          ln -sfn ../../joust-runtime js/node_modules/@julclang/joust-runtime
          cd js/joust
          ../../scripts/node-test.sh joust-cli test/cli.test.js test/deploy.test.js

      # The .jsc 2 reference interpreter (ADR-0018 D15): its crypto and the semantics' hand-written vectors. No packages
      # installed. The five-way differential tests in ./gradlew build run it too.
      - name: Test the .jsc reference interpreter
        working-directory: js/jsc-interpreter
        run: ../../scripts/node-test.sh jsc-interpreter test/*.test.js

      # ADR-0017 D7, D10: the Homebrew formula and JOUST's version order; the release flags' combinations.
      - name: Test the release scripts
        run: |
          bash .github/scripts/homebrew-formula-test.sh
          bash .github/scripts/release-flags-test.sh

      # The wrapper every `joust new` project gets is this repository's (the CLI copies it; the e2e test checks it).
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install the dApp page's Node dependencies
        working-directory: examples/dapp/frontend
        run: npm ci --ignore-scripts

      # The dApp page uses JOUST's Vite plugin from source (js/joust/src/vite.js). js/joust's package.json also names
      # this repository's npm packages, which only a local registry serves (ADR-0015 M2), so install just the plugin's
      # two dependencies beside it (js/node_modules); nothing is saved or tracked.
      - name: Install the Vite plugin's Node dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix js vite-plugin-node-polyfills@0.28.0 @rollup/plugin-inject@5.0.5

      # The dApp's typed clients come from the contracts' descriptions; then the page must build.
      - name: Generate the dApp's clients and build its page
        run: |
          ./gradlew :examples:dapp:jsClients --stacktrace
          (cd examples/dapp/frontend && npm run build)

      # Everything `./gradlew build -PnoDevnet` runs (the fuzz targets' replays included), but the short fuzz runs, which
      # the next step makes with libFuzzer's statistics logged.
      - name: Build and test (no DevKit)
        run: ./gradlew build -PnoDevnet -PnoFuzz --continue --stacktrace

      # gradle/jazzer-fuzz.gradle's fuzzShort (part of `build` without -PnoFuzz): each target for 30 s. Gradle logs
      # libFuzzer's statistics at --info; scripts/verification-report.py keeps each run's final line.
      - name: Fuzz each target briefly
        run: |
          set -o pipefail
          ./gradlew fuzzShort -PnoDevnet -Pfuzz.short=30s --continue --info --stacktrace 2>&1 | tee build/fuzz-gradle.log \
            | grep -E --line-buffered 'DONE|\[fuzz\]|FAILED|> Task :.*:fuzz'

      - name: Verify the publication scope
        run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true --stacktrace

      - name: Write the verification report
        if: always()
        run: |
          python3 scripts/verification-report.py build/verification --fuzz-log build/fuzz-gradle.log | tee -a "$GITHUB_STEP_SUMMARY"
          echo "${HEAD_SHA}" > build/verification/head.txt

      # The head's results, for reviewers (scripts/fetch-ci-build.sh): the JUnit XML of every JVM and npm test, the
      # five-way counts, the fuzz summary, and any fuzz finding (crash-* inputs, failure records, registered divergences).
      - name: Upload the verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification
          path: |
            build/verification/
            build/npm-test-results/
            **/build/test-results/**/*.xml
            **/build/fuzz/*.txt
            **/src/test/resources/**/crash-*
            build/fuzz-gradle.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-build
          path: '**/build/reports/tests/'


  # The npm packages' Wasm engines (ADR-0015), built as release.yml's npm job builds them, so a toolchain problem shows
  # on the PR and not after a release tag (v0.1.0-pre1-rc6 failed there). Published with their digests: a reviewer's
  # fetch-ci-build.sh checks them before it puts them in place.
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      # The engines are GraalVM Web Images (ADR-0015). Web Image ships with the GraalVM 25.3 release line (as JuLC's
      # native-image workflows); `java-version: '25'` resolves the older 25.0 line, whose image builder puts javac's
      # resource bundles into the image heap and fails (v0.1.0-pre1-rc6). setup-graalvm exports GRAALVM_HOME, which the
      # build reads (-PgraalvmHome); Gradle itself runs on Temurin 25, as the other jobs.
      - name: Set up GraalVM 25.3 (Web Image)
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          version: '25.3'
          distribution: 'graalvm'
          set-java-home: 'false'
          github-token: ${{ github.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Web Image needs a recent Binaryen (WasmGC heap types): Ubuntu 24.04's apt package (108) can't assemble its
      # output ("unknown heaptype kind"; v0.1.0-pre1-rc6). Binaryen 132 from its GitHub release, as JuLC, pinned by
      # SHA-256 (the release's own .sha256 asset). Keep the version and hash the same in build.yml and release.yml.
      - name: Install Binaryen
        shell: bash
        env:
          BINARYEN_VERSION: '132'
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        run: |
          set -euo pipefail
          f="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$f"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check Web Image and Binaryen
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GRAALVM_HOME/lib/svm/tools/svm-wasm" ]]; then
            echo "::error::This GraalVM has no Web Image (lib/svm/tools/svm-wasm); the engines cannot be built." >&2
            exit 1
          fi
          command -v wasm-as
          wasm-as --version

      - name: Build the engines
        run: >-
          ./gradlew :julc-state-runtime-wasm:runtimeWasm :julc-state-toolchain:toolchainWasm
          -PgraalvmHome="$GRAALVM_HOME" --stacktrace

      # The digests are written before anything runs the engines, from the files the build wrote.
      - name: Pack the packages with their engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js/joust-runtime/engine js/joust/engine
          cp julc-state-runtime-wasm/build/wasm/{joust-runtime.js,joust-runtime.js.wasm,package.json} js/joust-runtime/engine/
          cp julc-state-toolchain/build/wasm/{joust-toolchain.js,joust-toolchain.js.wasm,package.json} js/joust/engine/
          (cd js && sha256sum joust/engine/* joust-runtime/engine/* | tee engines.sha256)
          echo "${HEAD_SHA}" > js/engines.head
          { echo '### Engines'; echo '```'; cat js/engines.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -l js/joust-runtime/engine js/joust/engine
          for p in state-client joust-runtime joust create-joust; do (cd "js/$p" && npm pack --dry-run --ignore-scripts); done

      # Uploaded at once (before the steps below run the engines), for the cli and vscode jobs and for reviewers.
      - name: Upload the engines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engines
          path: |
            js/joust/engine/
            js/joust-runtime/engine/
            js/engines.sha256
            js/engines.head
          if-no-files-found: error
          retention-days: 14

      # Every create-joust template, built by the toolchain engine just built: the .jsc and Java counters must give the
      # same description and client. This repository's packages are linked beside js/joust (no registry).
      - name: Build the create-joust templates with the engine
        shell: bash
        run: |
          set -euo pipefail
          (cd js/state-client && npm ci --ignore-scripts)
          mkdir -p js/node_modules/@julclang
          ln -s ../../state-client js/node_modules/@julclang/state-client
          ln -s ../../joust-runtime js/node_modules/@julclang/joust-runtime
          cd js/create-joust
          ../../scripts/node-test.sh create-joust-engine test/*.test.js 2>&1 | tee "$RUNNER_TEMP/create-joust.tap"
          if grep -q '# SKIP\|﹣ .*# SKIP\|skipped [1-9]' "$RUNNER_TEMP/create-joust.tap"; then echo "::error::the template build was skipped"; exit 1; fi

      # ADR-0021 M5a: the language core in this commit's engine. JscLangTest writes the JVM's document models; the
      # engine's must be byte-identical, its diagnostics must be joust.build's (L1, on the path the server runs), and the
      # nesting cap must hold on the main thread and the server's 4 MB worker, cold (M5a's exit).
      - name: Test the language core in the engine
        run: |
          ./gradlew :julc-state-dsl:test --tests '*JscLangTest' -PnoFuzz --stacktrace
          node --experimental-wasm-exnref julc-state-toolchain/src/test/js/lang-in-node.mjs julc-state-toolchain/build/wasm julc-state-dsl/build/lang-parity.json

      # ADR-0021 M5a: the language server's protocol, watchdog, confinement, input and edit tests on this commit's
      # engine, then L10's figures with CI's looser bounds. Its two pinned dependencies go into js/node_modules, where
      # npm prunes what it did not install: the linked packages are linked again after it (#83 review F1).
      - name: Test the language server
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --prefix js vscode-languageserver@11.0.0 vscode-languageserver-textdocument@1.0.16
          mkdir -p js/node_modules/@julclang
          ln -sfn ../../state-client js/node_modules/@julclang/state-client
          ln -sfn ../../joust-runtime js/node_modules/@julclang/joust-runtime
          cd js/joust
          ../../scripts/node-test.sh joust-lsp --test-concurrency=1 test/lsp/*.test.js
          node test/lsp/measure-l10.mjs --check

      - name: Upload the engine job's npm test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-test-results-engines
          path: build/npm-test-results/
          if-no-files-found: warn
          retention-days: 14

  # ADR-0017 D8: the native joust, built with GraalVM 25.3 (as the engines), and .github/scripts/joust-cli-e2e.sh on it:
  # generated Gradle projects built from this commit's modules and plugin only; joust new -t node isolated from hostile
  # npm configuration (with controls that must fail); an npm project built through the native joust with this commit's
  # engines, giving the Gradle projects' description.
  cli:
    needs: engines
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up GraalVM 25.3
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          version: '25.3'
          distribution: 'graalvm'
          set-java-home: 'false'
          github-token: ${{ github.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download the engines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engines
          path: js

      - name: Check the engines' digests and link this repository's packages
        shell: bash
        run: |
          set -euo pipefail
          (cd js && sha256sum -c engines.sha256)
          (cd js/state-client && npm ci --ignore-scripts)
          mkdir -p js/node_modules/@julclang
          ln -s ../../state-client js/node_modules/@julclang/state-client
          ln -s ../../joust-runtime js/node_modules/@julclang/joust-runtime

      - name: Build the native joust
        run: ./gradlew :julc-state-cli:nativeCompile --stacktrace

      - name: Stage this commit's modules and plugin
        run: >-
          ./gradlew publishAllPublicationsToStagingRepository -PskipSigning
          -PstagingRepository="$RUNNER_TEMP/staging" --stacktrace

      - name: Run joust end to end
        run: >-
          bash .github/scripts/joust-cli-e2e.sh julc-state-cli/build/native/nativeCompile/joust
          "$RUNNER_TEMP/staging" "$RUNNER_TEMP/e2e"

  # ADR-0021 D9, D11, D12: the VS Code extension packaged from this commit's engine, checked (no native code, under
  # 16 MB, the engine's digests), and tested with @vscode/test-electron on the minimum and the current VS Code: the
  # smoke test and the hostile workspaces, trusted and restricted. No secret is referenced; nothing is published
  # (publishing to the Marketplace and Open VSX is a maintainer's, by hand).
  vscode:
    needs: engines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download the engines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engines
          path: js

      - name: Package the extension
        shell: bash
        run: |
          set -euo pipefail
          (cd js && sha256sum -c engines.sha256)
          cd js/vscode-joust
          npm ci --ignore-scripts
          npm run package

      # Recorded and uploaded BEFORE the tests open hostile workspaces in VS Code (#83 review S6).
      - name: Record and upload the .vsix
        working-directory: js/vscode-joust
        run: sha256sum vscode-joust.vsix | tee vscode-joust.vsix.sha256 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the .vsix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-joust-vsix
          path: |
            js/vscode-joust/vscode-joust.vsix
            js/vscode-joust/vscode-joust.vsix.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Test the packaged extension in VS Code 1.109.0 and stable
        working-directory: js/vscode-joust
        run: xvfb-run -a node test/electron/run.mjs --versions 1.109.0,stable

  # Mutation testing of what changed: PIT on the changed classes among gradle/pitest.gradle's targets (julc-state-api's
  # ValueAdapter and AddressAdapter, the certifier, the checker, joust.lock), Stryker on the changed files among
  # js/mutation/stryker.config.mjs's (src/lsp/select.js, src/build.js, src/toolchain*.js), with this commit's engines so
  # the engine-backed tests run. Thresholds below the baselines (docs/contributing/reviewing.md), so a change that leaves
  # its mutants alive fails while a flaky timeout does not; both scores are reported either way.
  mutation:
    needs: engines
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download the engines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engines
          path: js

      - name: The base to compare with
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then base="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then base="$BEFORE"
          else base="HEAD~1"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Mutation testing what changed since $base: $(git rev-parse "$base")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PIT on the changed security-relevant Java
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -o pipefail
          mkdir -p build/mutation
          python3 scripts/pit-changed.py "$BASE" --threshold 60 | tee build/mutation/pit.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stryker on the changed security-relevant JavaScript
        if: always()
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          (cd js && sha256sum -c engines.sha256)
          (cd js/state-client && npm ci --ignore-scripts)
          (cd js/mutation && npm ci --ignore-scripts)
          npm install --no-save --no-package-lock --ignore-scripts --prefix js vscode-languageserver@11.0.0 vscode-languageserver-textdocument@1.0.16
          mkdir -p js/node_modules/@julclang
          ln -sfn ../../state-client js/node_modules/@julclang/state-client
          ln -sfn ../../joust-runtime js/node_modules/@julclang/joust-runtime
          bash scripts/stryker-changed.sh "$BASE" 50 | tee build/mutation/stryker.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation
          path: |
            build/mutation/
            julc-state-toolchain/build/reports/pitest/
            julc-state-dsl/build/reports/pitest/
            js/joust/reports/mutation/
          if-no-files-found: warn
          retention-days: 14

  devnet:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: devnet (${{ matrix.shard.index }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Devnet + Yaci Store (localhost:8080), admin API on localhost:10000 (.github/ci/devkit.sh).
      # Started first: it boots while the rest installs and compiles.
      - name: Start Yaci DevKit
        run: |
          npm install -g @bloxbean/yaci-devkit@0.12.0
          .github/ci/devkit.sh start

      # The DevKit tests of the wallet page, the dApp and the Wasm runtime drive Node.
      - name: Install the Node dependencies the DevKit tests use
        run: |
          (cd examples/wallet/js && npm ci)
          (cd js/state-client && npm ci)
          (cd examples/dapp/frontend && npm ci)
          npm install --no-save --no-package-lock --prefix js vite-plugin-node-polyfills@0.28.0 @rollup/plugin-inject@5.0.5

      - name: Compile
        env:
          TASKS: ${{ matrix.shard.tasks }}
        run: ./gradlew ${TASKS//:test/:testClasses} --stacktrace

      # DappDevnetTest skips itself without the generated clients and the dependencies of the page it serves.
      - name: Generate the dApp's clients and build its page
        if: contains(matrix.shard.tasks, ':examples:dapp:test')
        run: |
          ./gradlew :examples:dapp:jsClients --stacktrace
          (cd examples/dapp/frontend && npm run build)

      # Restarts DevKit once if Yaci Store does not follow the chain.
      - name: Wait for Yaci DevKit
        run: |
          .github/ci/devkit.sh wait
          .github/ci/devkit.sh monitor

      - name: DevKit tests
        env:
          TASKS: ${{ matrix.shard.tasks }}
        run: ./gradlew $TASKS -PdevnetOnly --continue --stacktrace

      # Per-module test time (to rebalance .github/ci/devnet-shards.txt) and every skipped test: DevKit tests skip
      # themselves when a prerequisite is missing, which would otherwise pass silently.
      - name: Summarize the DevKit tests
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re, xml.etree.ElementTree as ET
          times, skipped = {}, []
          for f in glob.glob('**/build/test-results/test/*.xml', recursive=True):
              module = ':' + re.sub(r'/build/.*', '', f).replace('/', ':') + ':test'
              for c in ET.parse(f).getroot().iter('testcase'):
                  times[module] = times.get(module, 0) + float(c.get('time') or 0)
                  if c.find('skipped') is not None:
                      skipped.append(f"{c.get('classname')}.{c.get('name')}")
          print(f"### devnet (${{ matrix.shard.index }}): {round(sum(times.values()))} s in tests, {len(skipped)} skipped")
          for m, t in sorted(times.items(), key=lambda x: -x[1]): print(f"- `{m}` {round(t)} s")
          for t in skipped: print(f"- skipped: {t}")
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-devnet-${{ matrix.shard.index }}
          path: '**/build/reports/tests/test'

      - name: Upload the Yaci DevKit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaci-devkit-log-${{ matrix.shard.index }}
          path: |
            ${{ runner.temp }}/yaci-devkit.log
            ${{ runner.temp }}/yaci-devkit-heights.log
