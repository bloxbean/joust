name: Build

# Builds and tests every module and example, in parallel jobs, once per pushed head; the head's results are published as
# artifacts, so a reviewer fetches them (scripts/fetch-ci-build.sh <sha>; docs/contributing/reviewing.md) instead of
# building again:
#   build     compile, unit, harness, attack-suite, five-way and fuzz-replay tests, the short fuzz runs, the JavaScript
#             packages' tests and the dApp page; no DevKit (-PnoDevnet excludes the tests tagged devnet). Publishes
#             `verification` (JUnit XML of the JVM and npm tests, the five-way counts, the fuzz summary and any fuzz
#             findings).
#   devnet    the DevKit tests (@Tag("devnet")), sharded by .github/ci/devnet-shards.txt: each shard runs on its own runner
#             against its own Yaci DevKit, so shards share neither a devnet nor its faucet.
#   plan      checks that every module with DevKit tests is in exactly one shard, and hands the shards to devnet.
#   engines   the npm packages' Wasm engines, and the create-joust templates built with them. Publishes `engines` (both
#             engines and their SHA-256 digests, engines.sha256).
#   cli       the native joust (ADR-0017 D8), end to end with this commit's modules, plugin and engines.
#   vscode    the VS Code extension (ADR-0021), packaged with this commit's engine and tested in VS Code. Publishes
#             `vscode-joust-vsix` (the .vsix and its digest).
#   mutation  PIT on the changed security-relevant Java (the classes gradle/pitest.gradle's modules name), with a
#             reported score and a threshold. Publishes `mutation`.
#   stryker   Stryker on the changed security-relevant JavaScript, one job per js/mutation set (joust, joust-heap,
#             state-client), with a reported score and a threshold. Each publishes `stryker-<set>`.
#   fuzz-long the long fuzz campaigns, only when a workflow_dispatch gives fuzz_minutes (then nothing else runs).
# bloxbean-snapshot.yml publishes only commits whose push run of this workflow passed: every job must pass.
#
# Every action is pinned by its commit SHA. No job reads a repository secret; the engine and CLI jobs pass the run's
# read-only GITHUB_TOKEN (permissions: contents: read) to setup-graalvm, which only raises its API rate limit. npm
# installs run with --ignore-scripts; the one package whose binary its install script fetches (tree-sitter-cli, pinned
# in tree-sitter-jsc's lock file) is rebuilt by name.

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mutation_all:
        description: 'Mutation-test the whole security-relevant set (the baselines), not only what changed'
        type: boolean
        default: false
      fuzz_minutes:
        description: 'Run only the long fuzz campaigns (fuzz-long), the five-way target for this many minutes (at most 280)'
        type: string
        default: ''

permissions:
  contents: read

env:
  # Where scripts/node-test.sh writes the npm tests' JUnit XML (the verification artifact).
  NODE_TEST_RESULTS: ${{ github.workspace }}/build/npm-test-results
  # The head every job but devnet builds: a pull request's own head commit, not the merge with its base that
  # pull_request checks out by default, so the artifacts are the head's, the commit a reviewer has checked out
  # (scripts/fetch-ci-build.sh checks it). A push builds its commit.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    # A dispatch with fuzz_minutes runs fuzz-long only: plan, build and engines (and so every job after them) skip.
    if: ${{ !inputs.fuzz_minutes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      # A module whose DevKit tests are in no shard would silently stop running them in CI.
      - name: Read the shards and check they cover every DevKit test module
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, re, subprocess
          lines = [l.split() for l in open('.github/ci/devnet-shards.txt') if l.strip() and not l.startswith('#')]
          tasks = [t for line in lines for t in line]
          dupes = sorted({t for t in tasks if tasks.count(t) > 1})
          files = subprocess.run(['git', 'grep', '-l', '@Tag("devnet")', '--', '*.java'],
                                 capture_output=True, text=True, check=True).stdout.split()
          modules = sorted({':' + re.sub(r'/src/.*', '', f).replace('/', ':') + ':test' for f in files})
          missing = sorted(set(modules) - set(tasks))
          extra = sorted(set(tasks) - set(modules))
          if dupes or missing or extra:
              print(f"::error::devnet-shards.txt: in several shards {dupes}; in no shard {missing}; no DevKit tests {extra}")
              raise SystemExit(1)
          shards = [{'index': i + 1, 'tasks': ' '.join(line)} for i, line in enumerate(lines)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('shards=' + json.dumps(shards) + '\n')
          print(f"{len(modules)} DevKit test modules in {len(shards)} shards")
          EOF

  build:
    if: ${{ !inputs.fuzz_minutes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Restores only this job's own Gradle-home entry (review r1, security S2); without it setup-gradle falls back to
          # any job's entry on the same OS. The extracted entries (dependencies, transforms, instrumented jars, wrapper
          # zips…) are shared across jobs whatever this says: they are keyed by their contents' names only (review r2,
          # security S9). Pull requests save nothing; main's jobs that save (build, cli, mutation, fuzz-long) run only this
          # repository's code and locked dependencies once main's entries written before this change are purged
          # (reviewing.md §1: a maintainer step, after this change reaches main and that merge's push run has finished).
          gradle-home-cache-strict-match: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The wallet example's page proof of concept (examples/wallet/js) needs its Node dependencies.
      - name: Install the wallet page's Node dependencies
        working-directory: examples/wallet/js
        run: npm ci --ignore-scripts

      # The JavaScript client (ADR-0013 D3): its unit tests, then the dApp page that uses it.
      - name: Test the JavaScript client
        working-directory: js/state-client
        run: |
          npm ci --ignore-scripts
          ../../scripts/node-test.sh state-client test/*.test.js

      # npm create joust: what each template and contract language writes, and the command line.
      - name: Test create-joust
        working-directory: js/create-joust
        run: ../../scripts/node-test.sh create-joust test/*.test.js

      # ADR-0018 D13: the tree-sitter grammar (its own tests, then the shared parse corpus against the hand-written
      # parsers' verdicts and declarations, which JscCorpusTest checks on the Java side), and the TextMate grammar.
      # tree-sitter-cli's install script fetches its binary: it alone is rebuilt (the version is the lock file's).
      - name: Test the tree-sitter grammar and the shared parse corpus
        working-directory: tree-sitter-jsc
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npm test

      # The VS Code extension's Node-only tests (ADR-0021 D12): the TextMate grammar, the verified applyEdit handler, the
      # build task, the manifest. The packaged extension is tested in the vscode job.
      - name: Test the VS Code extension's grammar and client
        working-directory: js/vscode-joust
        run: |
          npm ci --ignore-scripts
          ../../scripts/node-test.sh vscode-joust test/*.test.mjs

      # The npm joust's command line (ADR-0017 D5, D9), and joust deploy's write of deployments.<network>.json with the
      # runtime and wallet stubbed (issue #75). Two cases run the command from this copy, whose build.js imports the
      # client: this repository's packages are linked beside js/joust while they run, as in the engines job (no registry).
      - name: Test the npm joust command line
        run: |
          mkdir -p js/node_modules/@julclang
          ln -sfn ../../state-client js/node_modules/@julclang/state-client
          ln -sfn ../../joust-runtime js/node_modules/@julclang/joust-runtime
          (cd js/joust && ../../scripts/node-test.sh joust-cli test/cli.test.js test/deploy.test.js)
          # Unlinked again: npm installing into js/node_modules below would reify through the links and prune the
          # client's own node_modules, which the dApp page's build needs.
          rm -r js/node_modules/@julclang

      # The .jsc 2 reference interpreter (ADR-0018 D15): its crypto and the semantics' hand-written vectors. No packages
      # installed. The five-way differential tests in ./gradlew build run it too.
      - name: Test the .jsc reference interpreter
        working-directory: js/jsc-interpreter
        run: ../../scripts/node-test.sh jsc-interpreter test/*.test.js

      # ADR-0017 D7, D10: the Homebrew formula and JOUST's version order; the release flags' combinations.
      - name: Test the release scripts
        run: |
          bash .github/scripts/homebrew-formula-test.sh
          bash .github/scripts/release-flags-test.sh

      # The mutation gates' own tests (scripts/test: review r3, design F19, Codex C12 and C13): the summaries and selectors
      # on synthetic reports, baselines and repositories.
      - name: Test the mutation gates
        run: python3 -m unittest discover -s scripts/test -p '*_test.py' -v

      # The wrapper every `joust new` project gets is this repository's (the CLI copies it; the e2e test checks it).
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install the dApp page's Node dependencies
        working-directory: examples/dapp/frontend
        run: npm ci --ignore-scripts

      # The dApp page uses JOUST's Vite plugin from source (js/joust/src/vite.js). js/joust's package.json also names
      # this repository's npm packages, which only a local registry serves (ADR-0015 M2), so install just the plugin's
      # two dependencies beside it (js/node_modules); nothing is saved or tracked.
      - name: Install the Vite plugin's Node dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix js vite-plugin-node-polyfills@0.28.0 @rollup/plugin-inject@5.0.5

      # The dApp's typed clients come from the contracts' descriptions; then the page must build.
      - name: Generate the dApp's clients and build its page
        run: |
          ./gradlew :examples:dapp:jsClients --stacktrace
          (cd examples/dapp/frontend && npm run build)

      # Everything `./gradlew build -PnoDevnet` runs (the fuzz targets' replays included), but the short fuzz runs, which
      # the next step makes with libFuzzer's statistics logged.
      - name: Build and test (no DevKit)
        run: ./gradlew build -PnoDevnet -PnoFuzz --continue --stacktrace

      # gradle/jazzer-fuzz.gradle's fuzzShort (part of `build` without -PnoFuzz), each public target for 30 s: the IR readers
      # and NODE_OPTIONS. -Pfuzz.public leaves out the decoders of on-chain data (ValueAdapter, AddressAdapter, the memos),
      # whose findings can be vulnerabilities: public CI only replays them (`test`), and they are fuzzed locally (SECURITY.md,
      # reviewing.md §3; JuLC ADR-063 D13). The five-way target is fuzzed by fuzz-long, not here. Gradle logs
      # libFuzzer's statistics at --info; scripts/verification-report.py keeps each run's final line.
      - name: Fuzz the public targets briefly
        run: |
          set -o pipefail
          ./gradlew fuzzShort -PnoDevnet -Pfuzz.public -Pfuzz.short=30s --continue --info --stacktrace 2>&1 | tee build/fuzz-gradle.log \
            | grep -E --line-buffered 'DONE|\[fuzz\]|FAILED|> Task :.*:fuzz'

      - name: Verify the publication scope
        run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true --stacktrace

      - name: Write the verification report
        if: always()
        run: |
          python3 scripts/verification-report.py build/verification --fuzz-log build/fuzz-gradle.log | tee -a "$GITHUB_STEP_SUMMARY"
          echo "${HEAD_SHA}" > build/verification/head.txt

      # The head's results, for reviewers (scripts/fetch-ci-build.sh), staged with their SHA256SUMS: the JUnit XML of the
      # JVM tests and of the npm suites this job runs, the five-way counts, every fuzz target's summary, and the failure
      # records and crash-* inputs of the public targets only (never of an on-chain decoder's: reviewing.md §3).
      - name: Stage and upload the verification artifacts
        if: always()
        run: >-
          bash scripts/stage-artifact.sh build/artifact-verification
          'build/verification/**' 'build/npm-test-results/**' '**/build/test-results/**/*.xml' '**/build/fuzz/*.summary.txt'
          '**/build/fuzz/IrReaderFuzzTest.*' '**/build/fuzz/NodeOptionsFuzzTest.*' '**/build/fuzz/FiveWayFuzzTest.*'
          '**/src/test/resources/**/IrReaderFuzzTestInputs/**/crash-*' '**/src/test/resources/**/NodeOptionsFuzzTestInputs/**/crash-*'
          'build/fuzz-gradle.log'

      - name: Upload the verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification
          path: build/artifact-verification/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-build
          path: '**/build/reports/tests/'


  # The npm packages' Wasm engines (ADR-0015), built as release.yml's npm job builds them, so a toolchain problem shows
  # on the PR and not after a release tag (v0.1.0-pre1-rc6 failed there). Published with their digests: a reviewer's
  # fetch-ci-build.sh checks them before it puts them in place.
  engines:
    if: ${{ !inputs.fuzz_minutes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      # The engines are GraalVM Web Images (ADR-0015). Web Image ships with the GraalVM 25.3 release line (as JuLC's
      # native-image workflows); `java-version: '25'` resolves the older 25.0 line, whose image builder puts javac's
      # resource bundles into the image heap and fails (v0.1.0-pre1-rc6). setup-graalvm exports GRAALVM_HOME, which the
      # build reads (-PgraalvmHome); Gradle itself runs on Temurin 25, as the other jobs.
      - name: Set up GraalVM 25.3 (Web Image)
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          version: '25.3'
          distribution: 'graalvm'
          set-java-home: 'false'
          github-token: ${{ github.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Web Image needs a recent Binaryen (WasmGC heap types): Ubuntu 24.04's apt package (108) can't assemble its
      # output ("unknown heaptype kind"; v0.1.0-pre1-rc6). Binaryen 132 from its GitHub release, as JuLC, pinned by
      # SHA-256 (the release's own .sha256 asset). Keep the version and hash the same in build.yml and release.yml.
      - name: Install Binaryen
        shell: bash
        env:
          BINARYEN_VERSION: '132'
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        run: |
          set -euo pipefail
          f="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$f"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check Web Image and Binaryen
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GRAALVM_HOME/lib/svm/tools/svm-wasm" ]]; then
            echo "::error::This GraalVM has no Web Image (lib/svm/tools/svm-wasm); the engines cannot be built." >&2
            exit 1
          fi
          command -v wasm-as
          wasm-as --version

      - name: Build the engines
        run: >-
          ./gradlew :julc-state-runtime-wasm:runtimeWasm :julc-state-toolchain:toolchainWasm
          -PgraalvmHome="$GRAALVM_HOME" --stacktrace

      # The digests are written before anything runs the engines, from the files the build wrote.
      - name: Pack the packages with their engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js/joust-runtime/engine js/joust/engine
          cp julc-state-runtime-wasm/build/wasm/{joust-runtime.js,joust-runtime.js.wasm,package.json} js/joust-runtime/engine/
          cp julc-state-toolchain/build/wasm/{joust-toolchain.js,joust-toolchain.js.wasm,package.json} js/joust/engine/
          (cd js && sha256sum joust/engine/* joust-runtime/engine/* | tee engines.sha256)
          echo "${HEAD_SHA}" > js/engines.head
          { echo '### Engines'; echo '```'; cat js/engines.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -l js/joust-runtime/engine js/joust/engine
          for p in state-client joust-runtime joust create-joust; do (cd "js/$p" && npm pack --dry-run --ignore-scripts); done

      # Uploaded at once (before the steps below run the engines), for the cli and vscode jobs and for reviewers.
      - name: Upload the engines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engines
          path: |
            js/joust/engine/
            js/joust-runtime/engine/
            js/engines.sha256
            js/engines.head
          if-no-files-found: error
          retention-days: 14

      # Every create-joust template, built by the toolchain engine just built: the .jsc and Java counters must give the
      # same description and client. This repository's packages are linked beside js/joust (no registry).
      - name: Build the create-joust templates with the engine
        shell: bash
        run: |
          set -euo pipefail
          (cd js/state-client && npm ci --ignore-scripts)
          mkdir -p js/node_modules/@julclang
          ln -s ../../state-client js/node_modules/@julclang/state-client
          ln -s ../../joust-runtime js/node_modules/@julclang/joust-runtime
          cd js/create-joust
          ../../scripts/node-test.sh create-joust-engine test/*.test.js 2>&1 | tee "$RUNNER_TEMP/create-joust.tap"
          if grep -q '# SKIP\|﹣ .*# SKIP\|skipped [1-9]' "$RUNNER_TEMP/create-joust.tap"; then echo "::error::the template build was skipped"; exit 1; fi

      # ADR-0021 M5a, M5b: the language core in this commit's engine. JscLangTest writes the JVM's document models; the
      # engine's must be byte-identical, the build's errors must be among its diagnostics (L1, on the path the server
      # runs), and the nesting cap must hold on the main thread and the server's 4 MB worker, cold (M5a's exit).
      # JscLangRecoveryTest is M5b's mutation corpus (L1 recovered, L13) and L5 (the build job runs it too). JscFormatTest
      # writes the formatter's cases, which lang.format must answer byte for byte (ADR-0021 §15 F5).
      - name: Test the language core in the engine
        run: |
          ./gradlew :julc-state-dsl:test --tests '*JscLangTest' --tests '*JscLangRecoveryTest' --tests '*JscFormatTest' -PnoFuzz --stacktrace
          node --experimental-wasm-exnref julc-state-toolchain/src/test/js/lang-in-node.mjs julc-state-toolchain/build/wasm julc-state-dsl/build/lang-parity.json

      # ADR-0021 M5a: the language server's protocol, watchdog, confinement, input and edit tests on this commit's
      # engine, then L10's figures with CI's looser bounds. Its two pinned dependencies go into js/node_modules, where
      # npm prunes what it did not install: the linked packages are linked again after it (#83 review F1).
      - name: Test the language server
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-js.sh
          cd js/joust
          ../../scripts/node-test.sh joust-lsp --test-concurrency=1 test/lsp/*.test.js
          # ADR-0021 D7a: the ABI diff and the bound acceptance through the CLI, on this engine.
          ../../scripts/node-test.sh joust-accept-abi test/accept-abi.test.js
          node test/lsp/measure-l10.mjs --check

      # ADR-0021 r10 §16 (M5e) E4-E6: the tree-sitter package, then the editor configurations in real editors: Neovim
      # headless (the shipped module starts this commit's joust-lsp by absolute path and gets diagnostics; a planted
      # node_modules/.bin/joust-lsp, .nvim.lua and .exrc never run) and Helix (`hx --health jsc`). Both editors are
      # pinned releases, checked by SHA-256 (their release pages' digests).
      - name: Package the tree-sitter grammar
        working-directory: tree-sitter-jsc
        run: |
          npm ci
          npm run package
          sha256sum dist/*.tar.gz

      - name: Test the editor configurations in Neovim and Helix
        shell: bash
        env:
          NVIM_VERSION: v0.12.6
          NVIM_SHA256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
          HELIX_VERSION: '25.07.1'
          HELIX_SHA256: 3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  $RUNNER_TEMP/nvim.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          f="helix-${HELIX_VERSION}-x86_64-linux.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/helix-editor/helix/releases/download/${HELIX_VERSION}/$f"
          echo "${HELIX_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          export NVIM_BIN="$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" HX_BIN="$RUNNER_TEMP/helix-${HELIX_VERSION}-x86_64-linux/hx"
          "$NVIM_BIN" --version | head -1
          "$HX_BIN" --version
          JOUST_REQUIRE_EDITORS=1 node --test --test-concurrency=1 editors/test/editors.test.mjs

      # Review r1, design F5: every npm suite that runs without DevKit, a browser or a preview key, on this commit's engines
      # (the security tests of M1h, M4 and #80 among them: migrate's link refusals, the worker's heap and time limits, the
      # library pin, the keyed window). Not here, because they need DevKit or Chromium: js/joust's create, dev and page;
      # js/joust-runtime's devkit, examples and providers; preview needs a Blockfrost preview key (reviewing.md §2). exnref
      # rejoined once #108 branched it on what the probe finds.
      - name: Test the npm packages on the engines
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-js.sh
          # #130 r1 (design D3): migrate was removed with .jsc v1 (#111); M5d's fmt and write-regular run here.
          (cd js/joust && ../../scripts/node-test.sh joust --test-concurrency=1 test/abi.test.js test/cold-engine.test.js \
            test/fmt.test.js test/libraries.test.js test/offline-ledger.test.js test/sources.test.js test/worker-limits.test.js \
            test/write-regular.test.js)
          (cd js/joust-runtime && ../../scripts/node-test.sh joust-runtime --test-concurrency=1 test/compat.test.js \
            test/exnref.test.js test/keyed-window.test.js test/messages.test.js test/mirror.test.js)

      # A skipped case here is a security case not run (review r2, design F16): libraries, migrate, worker-limits and
      # keyed-window skip when an engine or a fixture is missing. Every case of this job's suites must run.
      - name: No npm case skipped
        run: python3 scripts/junit-no-skips.py build/npm-test-results/*.xml

      - name: Stage the engine job's npm test results
        if: always()
        run: bash scripts/stage-artifact.sh build/artifact-npm-engines 'build/npm-test-results/**'

      - name: Upload the engine job's npm test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-test-results-engines
          path: build/artifact-npm-engines/
          if-no-files-found: warn
          retention-days: 14

  # ADR-0017 D8: the native joust, built with GraalVM 25.3 (as the engines), and .github/scripts/joust-cli-e2e.sh on it:
  # generated Gradle projects built from this commit's modules and plugin only; joust new -t node isolated from hostile
  # npm configuration (with controls that must fail); an npm project built through the native joust with this commit's
  # engines, giving the Gradle projects' description.
  cli:
    needs: engines
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up GraalVM 25.3
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          version: '25.3'
          distribution: 'graalvm'
          set-java-home: 'false'
          github-token: ${{ github.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Restores only this job's own Gradle-home entry (review r1, security S2); without it setup-gradle falls back to
          # any job's entry on the same OS. The extracted entries (dependencies, transforms, instrumented jars, wrapper
          # zips…) are shared across jobs whatever this says: they are keyed by their contents' names only (review r2,
          # security S9). Pull requests save nothing; main's jobs that save (build, cli, mutation, fuzz-long) run only this
          # repository's code and locked dependencies once main's entries written before this change are purged
          # (reviewing.md §1: a maintainer step, after this change reaches main and that merge's push run has finished).
          gradle-home-cache-strict-match: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download the engines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engines
          path: js

      - name: Check the engines' digests and link this repository's packages
        shell: bash
        run: |
          set -euo pipefail
          (cd js && sha256sum -c engines.sha256)
          (cd js/state-client && npm ci --ignore-scripts)
          mkdir -p js/node_modules/@julclang
          ln -s ../../state-client js/node_modules/@julclang/state-client
          ln -s ../../joust-runtime js/node_modules/@julclang/joust-runtime

      - name: Build the native joust
        run: ./gradlew :julc-state-cli:nativeCompile --stacktrace

      - name: Stage this commit's modules and plugin
        run: >-
          ./gradlew publishAllPublicationsToStagingRepository -PskipSigning
          -PstagingRepository="$RUNNER_TEMP/staging" --stacktrace

      - name: Run joust end to end
        run: >-
          bash .github/scripts/joust-cli-e2e.sh julc-state-cli/build/native/nativeCompile/joust
          "$RUNNER_TEMP/staging" "$RUNNER_TEMP/e2e"

  # ADR-0021 D9, D11, D12: the VS Code extension packaged from this commit's engine, checked (no native code, under
  # 16 MB, the engine's digests), and tested with @vscode/test-electron on the minimum and the current VS Code: the
  # smoke test and the hostile workspaces, trusted and restricted. No secret is referenced; nothing is published
  # (publishing to the Marketplace and Open VSX is a maintainer's, by hand).
  vscode:
    needs: engines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download the engines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engines
          path: js

      - name: Package the extension
        shell: bash
        run: |
          set -euo pipefail
          (cd js && sha256sum -c engines.sha256)
          cd js/vscode-joust
          npm ci --ignore-scripts
          npm run package

      # Recorded and uploaded BEFORE the tests open hostile workspaces in VS Code (#83 review S6).
      - name: Record and upload the .vsix
        working-directory: js/vscode-joust
        run: sha256sum vscode-joust.vsix | tee vscode-joust.vsix.sha256 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the .vsix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-joust-vsix
          path: |
            js/vscode-joust/vscode-joust.vsix
            js/vscode-joust/vscode-joust.vsix.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Test the packaged extension in VS Code 1.109.0 and stable
        working-directory: js/vscode-joust
        run: xvfb-run -a node test/electron/run.mjs --versions 1.109.0,stable

      # ADR-0021 r10 §16 (M5e) E7: the release's asset build (editor-assets.yml) on this commit, nothing attached. The
      # engine comes from an npm tarball of this commit's @julclang/joust, as the release takes it from the published one.
      - name: Build the editor assets (dry run)
        shell: bash
        run: |
          set -euo pipefail
          (cd tree-sitter-jsc && npm ci)
          v=$(node -p "require('./js/joust/package.json').version")
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack ./js/joust --ignore-scripts --pack-destination "$RUNNER_TEMP/npm"
          node .github/scripts/editor-assets.mjs --version "$v" --engine-tarball "$RUNNER_TEMP/npm/julclang-joust-$v.tgz" \
            --out "$RUNNER_TEMP/editor-assets"
          (cd "$RUNNER_TEMP/editor-assets" && sha256sum -c "editor-assets-$v-SHA256SUMS.txt") | tee -a "$GITHUB_STEP_SUMMARY"

  # Mutation testing of what a change can weaken (review r1, design F6), in parallel jobs: PIT here, on
  # gradle/pitest.gradle's targets (julc-state-api's ValueAdapter and AddressAdapter, the certifier, the checker, JscMain's
  # joust.lock); Stryker in the stryker job, one job per js/mutation set. A pull request mutates only its changed
  # classes and files (a renamed or deleted baselined file forces its set whole); pushes and the manual run's
  # mutation_all run every set whole. Each class and file must score at least its baseline in
  # gradle/mutation-baseline.json less 5 points.
  mutation:
    needs: plan
    runs-on: ubuntu-24.04
    # 330 minutes whatever the event (review r5, design F23): a pull request that changes the mutation configuration, the
    # baselines or the gate's scripts runs whole sets too (the joust set alone takes up to two hours and more).
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Restores only this job's own Gradle-home entry (review r1, security S2); without it setup-gradle falls back to
          # any job's entry on the same OS. The extracted entries (dependencies, transforms, instrumented jars, wrapper
          # zips…) are shared across jobs whatever this says: they are keyed by their contents' names only (review r2,
          # security S9). Pull requests save nothing; main's jobs that save (build, cli, mutation, fuzz-long) run only this
          # repository's code and locked dependencies once main's entries written before this change are purged
          # (reviewing.md §1: a maintainer step, after this change reaches main and that merge's push run has finished).
          gradle-home-cache-strict-match: true

      - name: The base to compare with
        id: base
        shell: bash
        # Whole sets on pushes (main, release/**) and on the manual run's mutation_all: their reports are the baselines'
        # and mutation-kills.json's source. A pull request (and a manual run without mutation_all, against HEAD~1)
        # mutates its changed units; a change to a set's mutation configuration, the gate's scripts or baselines, or a
        # rename or deletion of a baselined file still runs that set whole (reviewing.md §4).
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.mutation_all }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$ALL" == "true" || "$EVENT" == "push" ]]; then
            echo "base=--all" >> "$GITHUB_OUTPUT"; echo "changed_only=0" >> "$GITHUB_OUTPUT"
            echo "Mutation testing the whole set ($EVENT)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          elif [[ -n "$BASE_REF" ]]; then base="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then base="$BEFORE"
          else base="HEAD~1"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"; echo "changed_only=1" >> "$GITHUB_OUTPUT"
          echo "Mutation testing the units changed since $base: $(git rev-parse "$base")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PIT on the changed security-relevant Java
        env:
          BASE: ${{ steps.base.outputs.base }}
          JOUST_MUTATION_CHANGED_ONLY: ${{ steps.base.outputs.changed_only }}
        run: |
          set -o pipefail
          mkdir -p build/mutation
          python3 scripts/pit-changed.py "$BASE" --floor 40 | tee build/mutation/pit.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage the mutation reports
        if: always()
        run: >-
          bash scripts/stage-artifact.sh build/artifact-mutation 'build/mutation/**' 'julc-state-toolchain/build/reports/pitest/**'
          'julc-state-dsl/build/reports/pitest/**'

      - name: Upload the mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation
          path: build/artifact-mutation/
          if-no-files-found: warn
          retention-days: 14

  # Stryker, one js/mutation set per job (scripts/stryker-changed.sh): joust (js/joust's select.js, build.js,
  # toolchain.js), joust-heap (toolchain-heap.js, with worker-limits' slow heap cases, which the joust set skips) and
  # state-client (verify.js, keyed.js). It uses this commit's engines, so the engine-backed tests run and must not skip.
  stryker:
    needs: engines
    runs-on: ubuntu-24.04
    # 330 minutes whatever the event (review r5, design F23): a pull request that changes the mutation configuration, the
    # baselines or the gate's scripts runs whole sets too (the joust set alone takes up to two hours and more).
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        set: [joust, joust-heap, state-client]
    name: stryker (${{ matrix.set }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download the engines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engines
          path: js

      - name: The base to compare with
        id: base
        shell: bash
        # Whole sets on pushes (main, release/**) and on the manual run's mutation_all: their reports are the baselines'
        # and mutation-kills.json's source. A pull request (and a manual run without mutation_all, against HEAD~1)
        # mutates its changed units; a change to a set's mutation configuration, the gate's scripts or baselines, or a
        # rename or deletion of a baselined file still runs that set whole (reviewing.md §4).
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.mutation_all }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$ALL" == "true" || "$EVENT" == "push" ]]; then
            echo "base=--all" >> "$GITHUB_OUTPUT"; echo "changed_only=0" >> "$GITHUB_OUTPUT"
            echo "Mutation testing the whole set ($EVENT)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          elif [[ -n "$BASE_REF" ]]; then base="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then base="$BEFORE"
          else base="HEAD~1"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"; echo "changed_only=1" >> "$GITHUB_OUTPUT"
          echo "Mutation testing the units changed since $base: $(git rev-parse "$base")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stryker on the changed security-relevant JavaScript
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.base }}
          JOUST_STRYKER_SETS: ${{ matrix.set }}
          JOUST_MUTATION_CHANGED_ONLY: ${{ steps.base.outputs.changed_only }}
        run: |
          set -euo pipefail
          mkdir -p build/mutation
          (cd js && sha256sum -c engines.sha256)
          (cd js/mutation && npm ci --ignore-scripts)
          bash scripts/setup-js.sh
          JOUST_REQUIRE_ENGINES=1 bash scripts/stryker-changed.sh "$BASE" 10 | tee "build/mutation/stryker-$JOUST_STRYKER_SETS.md" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage the Stryker reports
        if: always()
        env:
          SET: ${{ matrix.set }}
        run: >-
          bash scripts/stage-artifact.sh build/artifact-stryker 'build/mutation/**' "js/joust/reports/mutation/$SET/**"
          "js/state-client/reports/mutation/$SET/**"

      - name: Upload the Stryker reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stryker-${{ matrix.set }}
          path: build/artifact-stryker/
          if-no-files-found: warn
          retention-days: 14

  # The long fuzz campaigns (review r1 design F3, r2 F3; JuLC's difftest-nightly.yml and ADR-063 D13), started by hand on
  # any branch, since GitHub runs a workflow_dispatch from the branch's own file:
  #   gh workflow run build.yml --repo bloxbean/joust --ref <branch> -f fuzz_minutes=60
  # The five-way target for fuzz_minutes, the IR readers for 20 minutes and NODE_OPTIONS for 10, each from the corpus the
  # branch's last campaign left (actions/cache). A failure uploads its input and its record. The decoders of on-chain
  # data are not fuzzed here: a finding can be a vulnerability and this repository's logs and artifacts are public, so
  # they are fuzzed locally and reported privately (SECURITY.md, reviewing.md §3). No secret is used.
  fuzz-long:
    if: ${{ inputs.fuzz_minutes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: julc-state-toolchain
            target: FiveWayFuzzTest
            duration: five-way
          - module: julc-state-dsl
            target: IrReaderFuzzTest
            duration: 20m
          - module: julc-state-toolchain
            target: NodeOptionsFuzzTest
            duration: 10m
    name: fuzz-long (${{ matrix.target }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-home-cache-strict-match: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The corpus Jazzer grew in this branch's last campaign (.cifuzz-corpus, git-ignored), so each one continues rather
      # than starts cold.
      - name: Restore the corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.module }}/.cifuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          MODULE: ${{ matrix.module }}
          TARGET: ${{ matrix.target }}
          DURATION: ${{ matrix.duration }}
          FIVE_WAY: ${{ inputs.fuzz_minutes }}
        run: |
          set -o pipefail
          [[ "$FIVE_WAY" =~ ^[0-9]+$ && "$FIVE_WAY" -ge 1 && "$FIVE_WAY" -le 280 ]] || { echo "fuzz_minutes must be 1-280, not $FIVE_WAY"; exit 1; }
          if [[ "$DURATION" == five-way ]]; then DURATION="${FIVE_WAY}m"; fi
          mkdir -p build
          ./gradlew ":${MODULE}:fuzz" --tests "*${TARGET}" -Pfuzz.duration="$DURATION" --info --stacktrace 2>&1 | tee build/fuzz-gradle.log \
            | grep -E --line-buffered 'DONE|\[fuzz\]|FAILED|pulse'

      - name: Report
        if: always()
        run: |
          python3 scripts/verification-report.py build/verification --fuzz-log build/fuzz-gradle.log | tee -a "$GITHUB_STEP_SUMMARY"

      # The failing input is saved as crash-* beside the target's seeds; its record (the program and calls, or the data,
      # and every leg's answer) is in build/fuzz/. For the five-way target, the record's .plan file replays it as a
      # source-level case (FiveWayRegressionTest) whatever the generator's version.
      - name: Upload the failing input and its record
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            ${{ matrix.module }}/src/test/resources/**/crash-*
            ${{ matrix.module }}/build/fuzz/
            build/fuzz-gradle.log
          retention-days: 30

      # With SHA256SUMS, which scripts/check-milestone-runs.sh checks (review r5, security N1).
      - name: Stage the summary
        if: success()
        env:
          MODULE: ${{ matrix.module }}
        run: >-
          bash scripts/stage-artifact.sh build/artifact-fuzz-summary "$MODULE/build/fuzz/*.summary.txt"
          'build/verification/fuzz.txt' 'build/fuzz-gradle.log'

      - name: Upload the summary
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-summary-${{ matrix.target }}
          path: build/artifact-fuzz-summary/
          retention-days: 30

  devnet:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: devnet (${{ matrix.shard.index }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Read-only (review r1, security S2): this job runs DevKit's npm tree, so it must not save the Gradle home that
          # other jobs restore.
          cache-read-only: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Devnet + Yaci Store (localhost:8080), admin API on localhost:10000 (.github/ci/devkit.sh).
      # Started first: it boots while the rest installs and compiles.
      - name: Start Yaci DevKit
        run: |
          npm install -g --ignore-scripts @bloxbean/yaci-devkit@0.12.0
          .github/ci/devkit.sh start

      # The DevKit tests of the wallet page, the dApp and the Wasm runtime drive Node.
      - name: Install the Node dependencies the DevKit tests use
        run: |
          (cd examples/wallet/js && npm ci --ignore-scripts)
          (cd js/state-client && npm ci --ignore-scripts)
          (cd examples/dapp/frontend && npm ci --ignore-scripts)
          npm install --no-save --no-package-lock --ignore-scripts --prefix js vite-plugin-node-polyfills@0.28.0 @rollup/plugin-inject@5.0.5

      - name: Compile
        env:
          TASKS: ${{ matrix.shard.tasks }}
        run: ./gradlew ${TASKS//:test/:testClasses} --stacktrace

      # DappDevnetTest skips itself without the generated clients and the dependencies of the page it serves.
      - name: Generate the dApp's clients and build its page
        if: contains(matrix.shard.tasks, ':examples:dapp:test')
        run: |
          ./gradlew :examples:dapp:jsClients --stacktrace
          (cd examples/dapp/frontend && npm run build)

      # Restarts DevKit once if Yaci Store does not follow the chain.
      - name: Wait for Yaci DevKit
        run: |
          .github/ci/devkit.sh wait
          .github/ci/devkit.sh monitor

      - name: DevKit tests
        env:
          TASKS: ${{ matrix.shard.tasks }}
        run: ./gradlew $TASKS -PdevnetOnly --continue --stacktrace

      # Per-module test time (to rebalance .github/ci/devnet-shards.txt) and every skipped test: DevKit tests skip
      # themselves when a prerequisite is missing, which would otherwise pass silently.
      - name: Summarize the DevKit tests
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re, xml.etree.ElementTree as ET
          times, skipped = {}, []
          for f in glob.glob('**/build/test-results/test/*.xml', recursive=True):
              module = ':' + re.sub(r'/build/.*', '', f).replace('/', ':') + ':test'
              for c in ET.parse(f).getroot().iter('testcase'):
                  times[module] = times.get(module, 0) + float(c.get('time') or 0)
                  if c.find('skipped') is not None:
                      skipped.append(f"{c.get('classname')}.{c.get('name')}")
          print(f"### devnet (${{ matrix.shard.index }}): {round(sum(times.values()))} s in tests, {len(skipped)} skipped")
          for m, t in sorted(times.items(), key=lambda x: -x[1]): print(f"- `{m}` {round(t)} s")
          for t in skipped: print(f"- skipped: {t}")
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-devnet-${{ matrix.shard.index }}
          path: '**/build/reports/tests/test'

      - name: Upload the Yaci DevKit log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yaci-devkit-log-${{ matrix.shard.index }}
          path: |
            ${{ runner.temp }}/yaci-devkit.log
            ${{ runner.temp }}/yaci-devkit-heights.log
