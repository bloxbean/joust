name: Build

# Builds and tests every module and example. The DevKit tests run against a Yaci DevKit started on the runner
# (they skip themselves when it is not reachable). bloxbean-snapshot.yml publishes only commits whose push run of
# this workflow passed.

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Devnet + Yaci Store (localhost:8080), admin API on localhost:10000.
      - name: Start Yaci DevKit
        run: |
          npm install -g @bloxbean/yaci-devkit
          nohup yaci-devkit up --enable-yaci-store > "$RUNNER_TEMP/yaci-devkit.log" 2>&1 &

      # The wallet example's page proof of concept (examples/wallet/js) needs its Node dependencies.
      - name: Install the wallet page's Node dependencies
        working-directory: examples/wallet/js
        run: npm ci

      # The JavaScript client (ADR-0013 D3): its unit tests, then the dApp page that uses it.
      - name: Test the JavaScript client
        working-directory: js/state-client
        run: |
          npm ci
          npm test

      - name: Install the dApp page's Node dependencies
        working-directory: examples/dapp/frontend
        run: npm ci

      # The dApp page uses JOUST's Vite plugin from source (js/joust/src/vite.js). js/joust's package.json also names
      # this repository's npm packages, which only a local registry serves (ADR-0015 M2), so install just the plugin's
      # two dependencies beside it (js/node_modules); nothing is saved or tracked.
      - name: Install the Vite plugin's Node dependencies
        run: npm install --no-save --no-package-lock --prefix js vite-plugin-node-polyfills@0.28.0 @rollup/plugin-inject@5.0.5

      - name: Compile
        run: ./gradlew assemble testClasses --stacktrace

      # The dApp's typed clients come from the contracts' descriptions; then the page must build.
      - name: Generate the dApp's clients and build its page
        run: |
          ./gradlew :examples:dapp:jsClients --stacktrace
          (cd examples/dapp/frontend && npm run build)

      - name: Wait for Yaci DevKit
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/api/v1/blocks/latest \
                && curl -sf -o /dev/null http://localhost:10000/local-cluster/api/admin/devnet; then
              echo "Yaci DevKit is up"
              exit 0
            fi
            sleep 5
          done
          echo "Yaci DevKit did not start within 5 minutes"
          tail -n 200 "$RUNNER_TEMP/yaci-devkit.log"
          exit 1

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Verify the publication scope
        run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'

      - name: Upload the Yaci DevKit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaci-devkit-log
          path: ${{ runner.temp }}/yaci-devkit.log
