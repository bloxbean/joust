description = 'JOUST annotation processor: @StateContract -> <Name>Validator (JuLC) + <Name>Client'

dependencies {
    implementation project(':julc-state-api')
    implementation project(':julc-state-verifier')   // MapVerifier's script hash, embedded in validators with MerkleMaps

    // Processor tests compile small contracts in-process (javax.tools) with this processor and JuLC's.
    testImplementation project(':julc-state-api')
    testImplementation project(':julc-state-runtime')
    testImplementation project(':julc-state-dsl')   // a real .jsc library lowering for the lint marker (design F2, r2)
    testImplementation libs.julc.annotation.processor
    testImplementation libs.julc.compiler
}

tasks.withType(Test).configureEach {
    // The tests run javac in-process and need the JDK compiler module.
    jvmArgs '--add-modules', 'jdk.compiler'
}

