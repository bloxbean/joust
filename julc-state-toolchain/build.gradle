description = 'JOUST toolchain: compiles .java and .jsc contracts without Gradle or a JDK (validators, descriptions, TS clients); the core of the Wasm toolchain engine (ADR-0015 D2)'

dependencies {
    implementation project(':julc-state-processor')
    implementation project(':julc-state-dsl')
    implementation libs.julc.compiler
    implementation libs.julc.stdlib
    implementation libs.julc.cardano.client.lib            // JulcScriptAdapter: script CBOR and hash, as JuLC's processor
    implementation libs.cardano.client.lib                 // PlutusV3Script, JulcScriptAdapter's result
    // JOUST's on-chain API sources, found on the class path as JuLC library sources (as on Gradle's processor path).
    runtimeOnly project(path: ':julc-state-api', configuration: 'onchainSources')

    // S2: transition programs evaluated by JuLC's VM against the contracts' JVM methods.
    testImplementation project(':examples:counter')
    testImplementation project(':examples:bank')
    testImplementation project(':examples:token')     // S2b: read discovery
    testImplementation project(':examples:dsl')       // ADR-0018 M0: .jsc 2 transition programs vs the JVM
    // ADR-0018 M1c (J11): the Java examples the .jsc 2 ports are measured against (size, budget, behaviour).
    testImplementation project(':examples:vault')
    testImplementation project(':examples:escrow')
    testImplementation project(':examples:crowdfund')
    testImplementation project(':examples:pool')
    testImplementation project(':examples:treasury')  // M1c review S1: a parameterised script, read beside its class
    testImplementation project(':examples:dex')       // ADR-0018 M2 (J11): the Java example the dex port is measured against
    testImplementation project(':examples:oracle')    // ADR-0018 M2c (J11): the Java examples the oracle and fees ports are measured against
    testImplementation project(':examples:fees')
    // ADR-0018 M3a (J11): the Java examples the owned-object ports are measured against; market's offer pins issue #81.
    testImplementation project(':examples:locker')
    testImplementation project(':examples:guild')
    testImplementation project(':examples:market')
    testImplementation libs.julc.vm.java
    testImplementation project(':julc-state-api')
    testImplementation project(':julc-state-runtime')     // PlutusDataAdapter, as the runtime encodes
    testImplementation project(':julc-state-testkit')     // ADR-0018 M0: the validator leg of the four-way vectors
}

// I1 compares with what the Gradle build of the examples wrote.
tasks.named('test') {
    systemProperty 'joust.s2.debug', System.getProperty('joust.s2.debug', 'false')
    // -Pjoust.writeIrFixtures: rewrite the JavaScript interpreter's java: fixture (js/jsc-interpreter/test/fixtures/java).
    if (project.hasProperty('joust.writeIrFixtures')) systemProperty 'joust.writeIrFixtures', 'true'
    inputs.dir(rootProject.file('examples/compliance/src/main/java')).withPropertyName('javaLibrarySources').withPathSensitivity(PathSensitivity.RELATIVE)
    // ADR-0018 D15 (M1b): the five-way tests run the JavaScript reference interpreter in Node (JsLeg).
    inputs.dir(rootProject.file('js/jsc-interpreter/src')).withPropertyName('jscInterpreterSources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('js/jsc-interpreter/bin')).withPropertyName('jscInterpreterBin').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('js/jsc-interpreter/test/fixtures')).withPropertyName('jscInterpreterFixtures').withPathSensitivity(PathSensitivity.RELATIVE)
    // EngineFixtureScriptsTest (M2c review r2, F9): the recorded oracle, so a change to fixtures/ alone runs it again.
    inputs.dir(rootProject.file('fixtures')).withPropertyName('fixtures').withPathSensitivity(PathSensitivity.RELATIVE)
    dependsOn ':examples:counter:classes', ':examples:bank:classes', ':examples:vault:classes', ':examples:escrow:classes',
            ':examples:dsl:classes', ':examples:guild:classes', ':examples:token:classes', ':examples:treasury:classes',
            ':examples:market:classes', ':examples:fees:classes', ':examples:crowdfund:classes', ':examples:pool:classes',
            ':examples:rollup:classes', ':examples:dex:classes', ':examples:staking:classes', ':examples:oracle:classes',
            ':examples:upgrade:classes', ':examples:locker:classes', ':examples:registry:classes'
}

tasks.register('i1Dump', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.julclang.state.toolchain.DumpForDiff'
    args 'dsl', 'market', 'treasury'
    systemProperty 'joust.toolchain.debug', 'true'
}

// Review r3 F13: the versions the engine reports, stamped into a generated class (a -D given to native-image is not
// visible to the image at run time).
def engineVersionsDir = layout.buildDirectory.dir('generated/sources/engineVersions/java')
def engineVersions = tasks.register('engineVersions') {
    def values = [joust: project.version.toString(), julc: libs.versions.julc.get()]
    inputs.properties(values)
    outputs.dir(engineVersionsDir)
    doLast {
        def f = engineVersionsDir.get().file('org/julclang/state/toolchain/wasm/EngineVersions.java').asFile
        f.parentFile.mkdirs()
        f.text = """package org.julclang.state.toolchain.wasm;

/** GENERATED by the engineVersions task: the versions this engine was built with. */
final class EngineVersions {
    private EngineVersions() {}

    static final String JOUST = "${values.joust}";
    static final String JULC = "${values.julc}";
}
"""
    }
}

// ---- The toolchain engine (ADR-0015 D1): a GraalVM Web Image embedding julc-wasm (JuLC ADR-064).
//   ./gradlew :julc-state-toolchain:toolchainWasm -PgraalvmHome=/path/to/graalvm-25.3   (Binaryen on PATH)
sourceSets {
    wasm {
        java.srcDir(files(engineVersionsDir).builtBy(engineVersions))
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}
dependencies {
    wasmImplementation "org.julclang:julc-wasm:${libs.versions.julc.get()}"
    wasmCompileOnly 'org.graalvm.sdk:webimage-preview:25.3.4.1'
    wasmRuntimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}
def toolchainGraalvm = providers.gradleProperty('graalvmHome').orElse(providers.environmentVariable('GRAALVM_HOME'))
def toolchainWasmDir = layout.buildDirectory.dir('wasm')
// #80 review S1: an image's resources no longer say which jar they came from, so the runtime takes its one copy of a
// validator's script unverified (ValidatorScripts). This check, over the image's class path, is what makes that safe:
// no script name twice, and every location holding a validator class also holds its script.
def checkImageScripts = tasks.register('checkImageScripts') {
    group = 'verification'
    description = 'Checks the image class path\'s META-INF/plutus scripts: one location per name, each beside its validator'
    def cp = sourceSets.wasm.runtimeClasspath
    inputs.files(cp)
    inputs.file(rootProject.file('gradle/plutus-scripts.gradle'))
    doLast {
        rootProject.ext.plutusScriptSelfTest(layout.buildDirectory.dir('tmp/plutusScriptSelfTest').get().asFile)
        def problems = rootProject.ext.plutusScriptProblems(cp.files)
        if (!problems.isEmpty()) throw new GradleException("the image's class path lends a validator another's script:\n  " + problems.join('\n  '))
    }
}
tasks.register('toolchainWasm', Exec) {
    dependsOn checkImageScripts
    group = 'build'
    description = 'Builds build/wasm/joust-toolchain.js(.wasm) with GraalVM Web Image'
    dependsOn 'wasmClasses'
    def cp = sourceSets.wasm.runtimeClasspath
    inputs.files(cp)
    inputs.property('graalvmHome', toolchainGraalvm.orElse(''))
    outputs.dir(toolchainWasmDir)
    doFirst {
        if (!toolchainGraalvm.isPresent()) throw new GradleException('set -PgraalvmHome=/path/to/graalvm-25.3 (or GRAALVM_HOME)')
        def ni = new File(toolchainGraalvm.get(), 'bin/native-image')
        def dir = toolchainWasmDir.get().asFile
        dir.mkdirs()
        executable ni.absolutePath
        args '--tool:svm-wasm', '-cp', cp.files.findAll { it.exists() }.collect { it.absolutePath }.join(File.pathSeparator),
                // JuLC's recipe: leave out the metadata registering JuLC's compiler services and CCL for its full image.
                '--exclude-config', '.*[/\\\\](julc-tools|julc-blueprint|cardano-client-[a-z0-9-]+|json-schema-validator)-[0-9][^/\\\\]*\\.jar',
                'META-INF/native-image/',
                // JOUST's on-chain API sources: the toolchain reads them as JuLC library sources.
                '-H:IncludeResources=META-INF/plutus-sources/.*',
                // Transition programs' library variants (MerkleMaps' read discovery; ADR-0015 D3).
                '-H:IncludeResources=META-INF/joust/discovery/.*',
                // The verifiers' compiled scripts, which the generators embed (MapVerifierInfo).
                '-H:IncludeResources=META-INF/plutus/.*\\.plutus\\.json',
                '-H:+UnlockExperimentalVMOptions', '-H:AbortOnTypeReachable=com.github.javaparser.*',
                '-H:+ReportExceptionStackTraces', "-Djoust.version=${project.version}", "-Djulc.version=${libs.versions.julc.get()}",
                '-o', new File(dir, 'joust-toolchain').absolutePath,
                'org.julclang.state.toolchain.wasm.JoustToolchainWasm'
    }
    doLast {
        new File(toolchainWasmDir.get().asFile, 'joust-toolchain.js.wat').delete()
        new File(toolchainWasmDir.get().asFile, 'package.json').text = '{ "type": "commonjs" }\n'
    }
}

// Gradle 9 removed Project.exec: a task action runs a process through an injected ExecOperations.
interface InjectedExecOps {
    @javax.inject.Inject
    ExecOperations getExecOps()
}
def injectedExec = objects.newInstance(InjectedExecOps)

// ADR-0015 S1: the engine compiles every example contract in Node, the same as Gradle (I1). Needs the image.
tasks.register('toolchainWasmTest', Exec) {
    group = 'verification'
    dependsOn 'toolchainWasm'
    dependsOn tasks.named('test').get().dependsOn
    dependsOn 'test'   // writes build/s2-vectors.json (TransitionParityTest)
    doLast {
        // S2 in Wasm: every transition vector through the engine's VM, against the JVM's answers.
        injectedExec.execOps.exec { commandLine 'node', 'julc-state-toolchain/src/test/js/run-transitions.mjs',
                'julc-state-toolchain/build/wasm', 'julc-state-toolchain/build/s2-vectors.json'; workingDir rootDir }
        // J18 in Wasm (ADR-0018 r12): the nesting cap and long chains, on Node's default stack, as on the JVM.
        injectedExec.execOps.exec { commandLine 'node', 'julc-state-toolchain/src/test/js/depth-in-node.mjs',
                'julc-state-toolchain/build/wasm'; workingDir rootDir }
        // S2b in Wasm: read discovery (build/s2b-vectors.json, from ReadDiscoveryTest).
        injectedExec.execOps.exec { commandLine 'node', 'julc-state-toolchain/src/test/js/run-discovery.mjs',
                'julc-state-toolchain/build/wasm', 'julc-state-toolchain/build/s2b-vectors.json', 'examples/token/src/main/java'; workingDir rootDir }
    }
    workingDir rootDir
    commandLine 'node', 'julc-state-toolchain/src/test/js/build-in-node.mjs',
            'julc-state-toolchain/build/wasm', 'examples', 'counter', 'bank', 'vault', 'escrow', 'crowdfund', 'dsl', 'guild',
            'token', 'treasury', 'market', 'fees', 'pool', 'rollup', 'dex', 'staking', 'oracle', 'upgrade', 'locker'
}
