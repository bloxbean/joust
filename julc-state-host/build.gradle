description = 'JOUST dev host: the project\'s own JOUST, driven by an IDE over stdio (ADR-0022)'

// ADR-0022 D1/D16: the host depends on the serving adapter and the runtime; no existing module depends on it, and
// applications never ship it (the Gradle plugin's joustHost configuration resolves it non-transitively, M1a-3).
dependencies {
    api project(':julc-state-serve')
    api project(':julc-state-runtime')
    // The runtime evaluator already supplies julc-vm, at JuLC's (independent) version.
    compileOnly libs.julc.vm.api
}

// ADR-0022 D3: the julc-state-runtime version this host was built with; `initialize` refuses another (`runtimeVersion`).
def hostVersionDir = layout.buildDirectory.dir('generated/sources/host-version/java')
def generateHostVersion = tasks.register('generateHostVersion') {
    def version = project.version.toString()
    inputs.property('version', version)
    outputs.dir(hostVersionDir)
    doLast {
        def f = new File(hostVersionDir.get().asFile, 'org/julclang/state/host/HostVersion.java')
        f.parentFile.mkdirs()
        f.text = """package org.julclang.state.host;

/** GENERATED by the build: the julc-state-runtime version this host was built with (ADR-0022 D3). */
final class HostVersion {
    static final String RUNTIME = "${version}";

    private HostVersion() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(generateHostVersion)

dependencies {
    // Generated clients and recorded fixtures for the tests (no DevKit needed).
    testImplementation project(':examples:counter')
    testImplementation project(':examples:escrow')
    testImplementation project(':examples:token')
    testImplementation project(':examples:bank')
    testImplementation project(':examples:treasury')
    testImplementation project(':examples:devkit')
    testImplementation project(':examples:dex')
    testImplementation project(':examples:registry')
    testImplementation project(':examples:pool')
    testAnnotationProcessor project(':julc-state-processor')
    testAnnotationProcessor libs.julc.annotation.processor
    testAnnotationProcessor project(path: ':julc-state-api', configuration: 'onchainSources')
}

tasks.withType(Test).configureEach {
    inputs.files(rootProject.fileTree('fixtures/m3') { include 'escrow/*.json', 'dex/*.json' })
            .withPropertyName('m3Recordings').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('fixtures/m0')).withPropertyName('fixturesM0').withPathSensitivity(PathSensitivity.RELATIVE)
    // The forked-host tests (fd 1 diversion, no side effects) launch `java` from this toolchain.
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'joust.host.java', launcher.get().executablePath.asFile.absolutePath
    systemProperty 'joust.host.fixtures', rootProject.file('fixtures/m0').absolutePath
}

// Gradle's test worker uses a bootstrap-only java.class.path. Give the child JVM its actual inputs.
tasks.named('test') {
    doFirst { systemProperty 'joust.host.testClassPath', sourceSets.test.runtimeClasspath.asPath }
}

// The dApp exercises the HTTP adapter and must still ship without the stdio host (§8).
def dappRuntime = project(':examples:dapp').configurations.named('runtimeClasspath')
def dappPackaging = tasks.register('checkDappHostIsolation') {
    def components = dappRuntime.map { it.incoming.resolutionResult.allComponents.collect { c -> c.moduleVersion?.name } }
    inputs.property('components', components)
    doLast {
        if ('julc-state-host' in components.get()) throw new GradleException('examples/dapp ships julc-state-host')
    }
}
tasks.named('check') { dependsOn dappPackaging }

if (providers.gradleProperty('joustHostTrace').isPresent()) {
    tasks.named('test', Test) {
        def launcher = rootProject.file('.github/scripts/trace-dev-host.sh')
        inputs.file(launcher)
        systemProperty 'joust.host.traceLauncher', launcher.absolutePath
    }
}

tasks.named('test', Test) {
    def vectors = rootProject.file('fixtures/host')
    inputs.files(rootProject.fileTree(vectors) { include '*.json' }).withPropertyName('hostVectors')
    systemProperty 'joust.host.vectors', vectors.absolutePath
    if (providers.gradleProperty('joustHostFixtures').isPresent()) {
        systemProperty 'joust.host.record', 'true'
        outputs.upToDateWhen { false }
    }
    if (providers.gradleProperty('joustHostE2e').isPresent()) {
        systemProperty 'joust.host.e2e', 'true'
        outputs.upToDateWhen { false }
    }
}

// Client-only tools. Neither main.output nor the host's runtimeElements variant depends on this source set.
sourceSets {
    conformance {
        compileClasspath += sourceSets.main.output
        resources {
            srcDir rootProject.file('fixtures/host')
            include 'sessions/*.json', 'verifier/*.json'
        }
    }
}
configurations.conformanceImplementation.extendsFrom configurations.implementation
dependencies {
    conformanceImplementation libs.bouncycastle.bcprov
    testImplementation sourceSets.conformance.output
    testImplementation libs.bouncycastle.bcprov
}
def clientKit = tasks.register('conformanceJar', Jar) {
    archiveClassifier = 'conformance'
    from(sourceSets.conformance.output)
    // Share the actual D2 codec. The classifier can run with the dependencies in the published POM.
    from(sourceSets.main.output) { include 'org/julclang/state/host/Frames*.class' }
    from(rootProject.file('docs/protocol/dev-host-1-conformance.md'))
}
publishing.publications.withType(MavenPublication).configureEach {
    if (name == 'mavenJava') artifact(clientKit)
}
tasks.named('test') {
    inputs.dir(rootProject.file('fixtures/host/verifier'))
    inputs.dir(rootProject.file('fixtures/host/sessions'))
    def archive = clientKit.flatMap { it.archiveFile }
    def clientClasspath = files(archive, configurations.conformanceRuntimeClasspath)
    inputs.files(clientClasspath).withPropertyName('packagedClientKit').withNormalizer(ClasspathNormalizer)
    doFirst {
        systemProperty 'joust.host.clientKit', archive.get().asFile.absolutePath
        systemProperty 'joust.host.clientKitClassPath', clientClasspath.asPath
    }
}

tasks.register('recordClientConformance', JavaExec) {
    group = 'verification'
    description = 'Regenerate protocol-1 client vectors and framed sessions from the offline host recordings.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.julclang.state.host.ClientVectors'
    systemProperty 'joust.mapStore', 'memory'
    systemProperty 'joust.host.fixtures', rootProject.file('fixtures/m0').absolutePath
    systemProperty 'joust.host.vectors', rootProject.file('fixtures/host').absolutePath
}
