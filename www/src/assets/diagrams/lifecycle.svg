<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" role="img" aria-label="An instance's life on chain: create, actions, destroy" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An instance's life on chain: create, actions, destroy</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3a3f5c"/></marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4f4ce0"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c46a06"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b1d3a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="980" height="450" rx="18" fill="#f7f8fc"/>
  <text x="28" y="40" font-size="17" font-weight="800" fill="#151729">An instance's life on chain</text>
  <text x="28" y="60" font-size="12.5" fill="#5b6074">One UTxO at a time, tied together by a one-shot thread token</text>
  <g filter="url(#shadow)"><rect x="66" y="150" width="180" height="104" rx="12" fill="#ffffff" stroke="#b9b8f6" stroke-width="1.5"/></g>
  <circle cx="88" cy="172" r="9" fill="#eceeff" stroke="#4f4ce0" stroke-width="1.5"/>
  <text x="104" y="177" font-size="13.5" font-weight="700" fill="#151729">Counter #1</text>
  <text x="82" y="200" font-size="12" fill="#5b6074" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">count: 0</text>
  <text x="82" y="217" font-size="12" fill="#5b6074" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">owner: alice</text>
  <rect x="80" y="228" width="102" height="20" rx="10" fill="#fff4e2" stroke="#f2c47c"/>
  <text x="89" y="242" font-size="11" font-weight="600" fill="#c46a06" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">thread token</text>
  <g filter="url(#shadow)"><rect x="306" y="150" width="180" height="104" rx="12" fill="#ffffff" stroke="#b9b8f6" stroke-width="1.5"/></g>
  <circle cx="328" cy="172" r="9" fill="#eceeff" stroke="#4f4ce0" stroke-width="1.5"/>
  <text x="344" y="177" font-size="13.5" font-weight="700" fill="#151729">Counter #1</text>
  <text x="322" y="200" font-size="12" fill="#5b6074" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">count: 5</text>
  <text x="322" y="217" font-size="12" fill="#5b6074" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">owner: alice</text>
  <rect x="320" y="228" width="102" height="20" rx="10" fill="#fff4e2" stroke="#f2c47c"/>
  <text x="329" y="242" font-size="11" font-weight="600" fill="#c46a06" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">thread token</text>
  <g filter="url(#shadow)"><rect x="546" y="150" width="180" height="104" rx="12" fill="#ffffff" stroke="#b9b8f6" stroke-width="1.5"/></g>
  <circle cx="568" cy="172" r="9" fill="#eceeff" stroke="#4f4ce0" stroke-width="1.5"/>
  <text x="584" y="177" font-size="13.5" font-weight="700" fill="#151729">Counter #1</text>
  <text x="562" y="200" font-size="12" fill="#5b6074" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">count: 7</text>
  <text x="562" y="217" font-size="12" fill="#5b6074" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">owner: alice</text>
  <rect x="560" y="228" width="102" height="20" rx="10" fill="#fff4e2" stroke="#f2c47c"/>
  <text x="569" y="242" font-size="11" font-weight="600" fill="#c46a06" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">thread token</text>
  <g filter="url(#shadow)"><rect x="786" y="150" width="180" height="61" rx="12" fill="#ffffff" stroke="#9fd9c0" stroke-width="1.5"/></g>
  <circle cx="808" cy="172" r="9" fill="#e6f6ef" stroke="#0f7a55" stroke-width="1.5"/>
  <text x="824" y="177" font-size="13.5" font-weight="700" fill="#151729">alice's wallet</text>
  <text x="802" y="200" font-size="12" fill="#5b6074" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">the deposit back</text>
  <rect x="36" y="300" width="330" height="1" fill="#d4d7ef"/><rect x="614" y="300" width="330" height="1" fill="#d4d7ef"/>
  <g transform="translate(46 320)"><rect width="210" height="58" rx="12" fill="#ffffff" stroke="#c3c7da"/>
  <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#151729" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">create</text>
  <text x="105" y="43" text-anchor="middle" font-size="12" fill="#5b6074">@Init: mints the token</text></g>
  <g transform="translate(286 320)"><rect width="210" height="58" rx="12" fill="#ffffff" stroke="#c3c7da"/>
  <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#151729" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">increment(5)</text>
  <text x="105" y="43" text-anchor="middle" font-size="12" fill="#5b6074">@Action</text></g>
  <g transform="translate(526 320)"><rect width="210" height="58" rx="12" fill="#ffffff" stroke="#c3c7da"/>
  <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#151729" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">increment(2)</text>
  <text x="105" y="43" text-anchor="middle" font-size="12" fill="#5b6074">@Action</text></g>
  <g transform="translate(766 320)"><rect width="210" height="58" rx="12" fill="#ffffff" stroke="#c3c7da"/>
  <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#151729" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">close</text>
  <text x="105" y="43" text-anchor="middle" font-size="12" fill="#5b6074">@Destroy: burns it</text></g>
  <polyline points="250,200 302,200" fill="none" stroke="#4f4ce0" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <polyline points="490,200 542,200" fill="none" stroke="#4f4ce0" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <polyline points="730,200 782,200" fill="none" stroke="#4f4ce0" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <text x="126" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#5b6074">transaction 1 creates</text>
  <text x="366" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#5b6074">each action spends one UTxO</text>
  <text x="606" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#5b6074">and creates the next</text>
  <text x="846" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#5b6074">destroy pays out</text>
  <text x="490" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6074">the transaction that made each one</text>
  <text x="490" y="418" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3a3f5c">Same script address, same token, exact value: the validator checks every step</text>

</svg>
