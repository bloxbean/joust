plugins {
    id 'application'
}

description = 'JOUST example: crowdfund'

dependencies {
    implementation project(':julc-state-runtime')
    implementation project(':examples:devkit')

    annotationProcessor project(':julc-state-processor')
    annotationProcessor libs.julc.annotation.processor
    annotationProcessor project(path: ':julc-state-api', configuration: 'onchainSources')

    testImplementation project(':julc-state-testkit')
}

application {
    mainClass = 'org.julclang.state.examples.crowdfund.CrowdfundApp'
}

tasks.named('run', JavaExec) {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('run', JavaExec) {
    systemProperties System.getProperties().findAll { k, v -> k.toString().startsWith('joust.') || k.toString().startsWith('julc.') }
}
