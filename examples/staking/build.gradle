description = 'JOUST example: staking (staked funds, rewards, certificates, votes, guardrail; ADR-0010)'

dependencies {
    implementation project(':julc-state-runtime')
    implementation project(':examples:devkit')

    annotationProcessor project(':julc-state-processor')
    annotationProcessor libs.julc.annotation.processor
    annotationProcessor project(path: ':julc-state-api', configuration: 'onchainSources')

    testImplementation project(':julc-state-testkit')
}

// -Pjoust.traces: each failing validator check traces its name (debugging only; larger scripts).
if (project.hasProperty('joust.traces')) {
    tasks.named('compileJava') { options.compilerArgs += ['-Ajoust.traces=true'] }
}

// JuLC's pinned CIP-57 revision has no vocabulary for the VOTE/PROPOSE purposes yet: compile without a blueprint.
tasks.named('compileJava') { options.compilerArgs += ['-Ajulc.blueprint=false'] }
