description = 'JOUST example: contracts written in .jsc (ADR-0005)'

configurations {
    jsc
    // ADR-0018 D9 (M4b): Java (JuLC) libraries .jsc imports with java:, taken as on-chain sources only (as the plugin's
    // joustLibrary configuration does): their META-INF/plutus-sources are compiled into this project, on both sides.
    joustLibrary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    jsc project(':julc-state-dsl')
    jsc project(':julc-state-toolchain')   // the java: library certifier (javac attribution needs JuLC's compiler)
    joustLibrary project(':examples:compliance')

    implementation project(':julc-state-runtime')
    implementation project(':examples:devkit')

    annotationProcessor project(':julc-state-processor')
    annotationProcessor libs.julc.annotation.processor
    annotationProcessor project(path: ':julc-state-api', configuration: 'onchainSources')

    testImplementation project(':julc-state-testkit')
}

// ADR-0018 D9 (M4b): the java: libraries' on-chain sources, extracted from their jars. They are compiled into this
// project (the JVM side runs these sources, never a jar's classes), certified by generateJsc before any import, and
// checked not to reach the runtime class path from elsewhere (checkJoustLibraries).
def librarySources = layout.buildDirectory.dir('joust/library-sources')
def extractJoustLibraries = tasks.register('extractJoustLibraries', Sync) {
    description = 'Extracts the on-chain sources (META-INF/plutus-sources) of the joustLibrary dependencies'
    dependsOn configurations.joustLibrary
    from({ configurations.joustLibrary.collect { zipTree(it) } }) {
        include 'META-INF/plutus-sources/**/*.java'
        eachFile { f -> f.relativePath = new RelativePath(true, f.relativePath.segments.drop(2)) }
        includeEmptyDirs = false
    }
    into librarySources
}
sourceSets.main.java.srcDir(files(librarySources).builtBy(extractJoustLibraries))

// .jsc -> Java @StateContract, before compileJava (ADR-0005 D5). The generated Java is ordinary source: the JOUST
// processor turns it into a validator and a client like hand-written contracts.
def jscSrc = file('src/main/jsc')
def jscOut = layout.buildDirectory.dir('generated/sources/jsc/java/main')
def generateJsc = tasks.register('generateJsc', JavaExec) {
    description = 'Lowers src/main/jsc/**/*.jsc to Java'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    dependsOn extractJoustLibraries
    inputs.dir(jscSrc)
    inputs.dir(librarySources)
    outputs.dir(jscOut)
    inputs.file(file('joust.lock')).optional()
    args jscSrc.path, jscOut.get().asFile.path, '--java-libraries', librarySources.get().asFile.path, '--lock', file('joust.lock').path
}
// ADR-0018 J12: joust.lock pins every library from outside the sources (the java: ones here) by its sources' hash; only
// this task writes it, to be reviewed and committed.
tasks.register('acceptJoustLock', JavaExec) {
    description = 'Writes joust.lock: the SHA-256 of every library from outside the sources this build uses'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    dependsOn extractJoustLibraries
    args jscSrc.path, layout.buildDirectory.dir('tmp/acceptJoustLock').get().asFile.path, '--java-libraries', librarySources.get().asFile.path,
            '--lock', file('joust.lock').path, '--accept-lock'
}
// ADR-0018 D12 (review F1): generateJsc never accepts an ABI manifest; a new or changed one is accepted only by running
// this task, which writes the manifests beside the .jsc files to be reviewed and committed.
tasks.register('acceptJscAbi', JavaExec) {
    description = 'Writes the ABI manifests (Name.abi.json) of src/main/jsc/**/*.jsc, accepting new and changed ones'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    dependsOn extractJoustLibraries
    args jscSrc.path, layout.buildDirectory.dir('tmp/acceptJscAbi').get().asFile.path, '--accept-abi', '--java-libraries',
            librarySources.get().asFile.path
}
// Review F12, S10: after compileJava, every manifest is checked against the processor's description (JSC0004).
def checkJscAbi = tasks.register('checkJscAbi', JavaExec) {
    description = 'Checks the ABI manifests of src/main/jsc/**/*.jsc against the processor\'s descriptions'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    dependsOn 'compileJava'
    def described = layout.buildDirectory.dir('classes/java/main/META-INF/joust')
    inputs.dir(jscSrc)
    inputs.dir(described)
    args '--check-abi', jscSrc.path, described.get().asFile.path, '--java-libraries', librarySources.get().asFile.path
}
tasks.named('check') { dependsOn checkJscAbi }
// ADR-0018 D9 (M4b): no class compiled from a java: library's sources also reaches the runtime class path from a jar.
def checkJoustLibraries = tasks.register('checkJoustLibraries', JavaExec) {
    description = 'Fails when a class of a java: library also reaches the runtime class path from a jar or directory'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    dependsOn extractJoustLibraries
    def own = files(sourceSets.main.output)
    def runtime = sourceSets.main.runtimeClasspath
    inputs.files(runtime)
    argumentProviders.add({ ['--check-library-classes', librarySources.get().asFile.path,
                             (runtime - own).files.collect { it.absolutePath }.join(File.pathSeparator)] } as CommandLineArgumentProvider)
}
tasks.named('check') { dependsOn checkJoustLibraries }
// ...and the bytes of each such class are recorded, for the runtime to check when it loads a contract (JavaLibraryCheck).
def recordJoustLibraries = tasks.register('recordJoustLibraries', JavaExec) {
    description = 'Records the SHA-256 of each class compiled from a java: library\'s sources (META-INF/joust/java-libraries.json)'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    def classesDir = sourceSets.main.java.destinationDirectory
    args '--library-manifest', librarySources.get().asFile.path, classesDir.get().asFile.path
}
tasks.named('compileJava') { finalizedBy recordJoustLibraries }
tasks.named('classes') { dependsOn recordJoustLibraries }
sourceSets.main.java.srcDir(files(jscOut).builtBy(generateJsc))
// ADR-0018 D12 (r12): each contract's message map is a resource beside its classes (the runtime explains refusals with it).
tasks.named('processResources') { from(files(jscOut).builtBy(generateJsc)) { include '**/*.jscmap.json' } }

// ADR-0018 M1c (J11): the Java examples' own tests, run against their .jsc 2 ports (src/main/jsc/.../{Vault,Escrow,
// Crowdfund,Token,Pool}.jsc). copyPortTests copies each example's test sources with three textual changes: the package
// becomes the ports' package, each class gets a Port suffix, and the init is called by its .jsc 2 name (init). Nothing
// else changes, so a port passes exactly the scenarios (unit, attack suite, description, DevKit) its Java example passes,
// and the two cannot drift apart. :examples:dsl:test runs them (this task only copies). It fails closed (review F7):
// an example's src/test holding anything the rule does not copy (a subpackage, a helper class, resources) stops the build.
def ports = [vault: ['Vault', 'open'], escrow: ['Escrow', 'open'], crowdfund: ['Crowdfund', 'launch'],
             token: ['Token', 'create'], pool: ['Pool', null]]
def portTestsOut = layout.buildDirectory.dir('generated/sources/portTests/java')
def copyPortTests = tasks.register('copyPortTests', Sync) {
    description = 'Copies the Java examples\' tests (run by :examples:dsl:test) to test their .jsc 2 ports; fails on anything it cannot copy'
    // The rewrite below is code, not a file: state it as an input, so a changed rule re-runs the copy.
    inputs.property('ports', ports.collect { k, v -> "${k}=${v}" }.join(','))
    inputs.property('rules', 'package; class <X>Test -> <X>PortTest; DescriptionTest -> <Contract>DescriptionPortTest; <Contract>.<init>( -> <Contract>.init(')
    ports.keySet().each { example -> inputs.dir(rootProject.file("examples/${example}/src/test")) }
    into portTestsOut
    doFirst {
        ports.keySet().each { example ->
            def root = rootProject.file("examples/${example}/src/test")
            def pkg = new File(root, "java/org/julclang/state/examples/${example}")
            root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.parentFile != pkg || !f.name.endsWith('Test.java')) {
                    throw new GradleException("copyPortTests cannot run ${rootProject.relativePath(f)} against the ${example} port: only " +
                            "*Test.java directly in ${rootProject.relativePath(pkg)} are copied; extend the copy rule (examples/dsl/build.gradle)")
                }
            }
        }
    }
    ports.each { example, port ->
        String contract = port[0]
        String init = port[1]
        from(rootProject.file("examples/${example}/src/test/java/org/julclang/state/examples/${example}")) {
            include '*Test.java'
            into 'org/julclang/state/examples/dsl'
            rename { String f -> f == 'DescriptionTest.java' ? "${contract}DescriptionPortTest.java" : f.replace('Test.java', 'PortTest.java') }
            filter { String line ->
                String out = line.replace("package org.julclang.state.examples.${example};", 'package org.julclang.state.examples.dsl;')
                        .replaceAll(/\bclass (\w+)Test\b/, 'class $1PortTest')
                        .replace('class DescriptionPortTest', "class ${contract}DescriptionPortTest")
                if (init != null) out = out.replace("${contract}.${init}(", "${contract}.init(")
                return out
            }
        }
    }
}
sourceSets.test.java.srcDir(files(portTestsOut).builtBy(copyPortTests))

// ADR-0018 D16: the v1 files translated to .jsc 2, into build/jsc-migrated (src/main/jsc is not changed).
tasks.register('migrateJsc', JavaExec) {
    description = 'Translates the .jsc v1 files of src/main/jsc to .jsc 2, into build/jsc-migrated'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    args '--migrate', jscSrc.path, layout.buildDirectory.dir('jsc-migrated').get().asFile.path
}

// ADR-0018 D12: javac's diagnostics on the generated Java, reported again at their .jsc positions (as the plugin does).
def javacLog = layout.buildDirectory.file('jsc/javac.log').get().asFile
def remapJsc = tasks.register('remapJscDiagnostics', JavaExec) {
    description = 'Reports compileJava\'s diagnostics on Java generated from .jsc at their .jsc positions'
    classpath = configurations.jsc
    mainClass = 'org.julclang.state.dsl.JscMain'
    def log = javacLog
    onlyIf { log.length() > 0 }
    args '--remap', log.path, jscOut.get().asFile.path, jscSrc.path
    doLast { log.delete() }
}
tasks.named('compileJava') {
    def log = javacLog
    doFirst {
        log.parentFile.mkdirs()
        log.text = ''
        def append = { log.append(it.toString()) } as StandardOutputListener
        logging.addStandardOutputListener(append)
        logging.addStandardErrorListener(append)
    }
    finalizedBy remapJsc
}
