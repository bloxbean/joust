rootProject.name = 'app'
include 'sibling'
dependencyResolutionManagement {
    repositories {
        maven { url = uri('fixture-repo') }
        exclusiveContent {
            forRepository { maven { url = uri(providers.gradleProperty('testRepo').get()) } }
            filter { includeVersionByRegex 'org.julclang', 'julc-state-.*', java.util.regex.Pattern.quote(providers.gradleProperty('joustVersion').get()) }
        }
        mavenCentral()
        maven { url = uri('https://repo.bloxbean.org/maven/releases') }
        // Last (#150 review DA10): a stale local build cannot change the graph this consumer tests.
        mavenLocal()
    }
}
