plugins {
    id 'org.julclang.joust'
    id 'maven-publish'
}
joust { blockfrost = false }
group = 'fixture'
version = '1'
sourceSets.main.java.destinationDirectory.set(layout.buildDirectory.dir('custom/classes'))
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('custom/resources').get().asFile

// A second source-set output with a producer independent of compileJava and processResources.
def maps = tasks.register('messageMaps', Copy) {
    from('maps')
    into(layout.buildDirectory.dir('custom/maps'))
}
sourceSets.main.output.dir([builtBy: maps], layout.buildDirectory.dir('custom/maps'))

dependencies {
    implementation project(':sibling')
    runtimeOnly files('local.jar')
    runtimeOnly 'fixture:forced:1'
    runtimeOnly 'fixture:replaced:1'
    if (project.hasProperty('http')) implementation "org.julclang:julc-state-server:${joustVersion}"
    if (project.hasProperty('badRuntime')) runtimeOnly "org.julclang:julc-state-serve:${joustVersion}"
    if (project.hasProperty('missingFile')) runtimeOnly files('missing.jar')
}
configurations.runtimeClasspath {
    resolutionStrategy.force 'fixture:forced:2'
    resolutionStrategy.dependencySubstitution {
        substitute module('fixture:replaced') using module('fixture:replacement:1')
    }
    if (project.hasProperty('incompatible')) resolutionStrategy.force 'org.julclang:julc-state-serve:old'
    if (project.hasProperty('badRuntime')) resolutionStrategy.force 'org.julclang:julc-state-runtime:old'
    if (project.hasProperty('missingJackson')) exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
}

publishing.publications.create('app', MavenPublication) { from components.java }

tasks.register('applicationClasspath') {
    def runtime = sourceSets.main.runtimeClasspath
    def expected = layout.buildDirectory.file('expected-classpath')
    dependsOn runtime
    doLast { expected.get().asFile.text = runtime.files.findAll { it.exists() }.collect { it.absolutePath }.join('\n') }
}
