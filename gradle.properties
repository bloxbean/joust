group=org.julclang
version=0.1.0-pre1-rc4
org.gradle.jvmargs=-Xmx2g
# Publish MD5 and SHA-1 checksums only (Maven Central requires those two; SHA-256/512 are optional): 100 fewer files
# per version. Central limits the files a namespace may hold, and org.julclang holds JuLC's too.
systemProp.org.gradle.internal.publish.checksums.insecure=true
# Release side effect of a v* tag, independent of the Maven Central deployment. The Central deployment
# is always staged (USER_MANAGED) and needs a human to publish it, but the GitHub release is public
# the moment the tag is pushed. Set to false to rehearse the release pipeline end to end without
# publishing anything.
github_release=true
# Release destinations (.github/workflows/release.yml, on a v* tag). Stated, not defaulted.
# maven_central_publish: stage a USER_MANAGED Central deployment (a release owner publishes it with publish-central.yml
# or in the Central Portal).
maven_central_publish=true
# bloxbean_repo_publish: publish to https://repo.bloxbean.org/maven/releases, public and permanent at once. Both get the
# same signed files; turn Central off to release to the BloxBean repository only (e.g. Central's quota is exhausted).
bloxbean_repo_publish=true
# npm_publish: publish the four npm packages; false runs `npm publish --dry-run` only.
npm_publish=false
# allow_snapshot_dependencies: let a release depend on SNAPSHOT pins (gradle/libs.versions.toml) with a warning instead of
# failing. Rehearsals only: the release workflow then requires every publish flag above to be false (Central refuses
# snapshot dependencies, and a published release that names a snapshot breaks once that snapshot is pruned). False now
# that JuLC is pinned to a release (0.1.0-pre21-rc1): with it true and the publish flags on, v0.1.0-pre1-rc3 and -rc4
# failed at "Validate tag and read release flags".
allow_snapshot_dependencies=false
